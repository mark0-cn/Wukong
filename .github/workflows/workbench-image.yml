name: Workbench image
run-name: Workbench image · local-${{ inputs.version }} · ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Client MAJOR.MINOR.PATCH version; must equal the checked-out Cargo.toml version'
        type: string
        required: true
      ref:
        description: 'Git ref to build; defaults to the ref selected for this run'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: workbench-image-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ vars.WORKBENCH_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate the requested version and target repository
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.ref || github.ref }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version '$VERSION' must be MAJOR.MINOR.PATCH without leading zeros or suffixes."
            exit 1
          fi
          current=$(python -m scripts.release.cli check)
          if [[ "$VERSION" != "$current" ]]; then
            echo "::error::version '$VERSION' must equal the checked-out Cargo.toml version '$current'; select the matching ref or prepare the version first."
            exit 1
          fi
          if [[ ! "$NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ || -z "$USERNAME" ]]; then
            echo "::error::Configure the DOCKERHUB_NAMESPACE and DOCKERHUB_USERNAME repository variables."
            exit 1
          fi
          revision=$(git rev-parse HEAD)
          # The workbench repository is intentionally separate from the official
          # <namespace>/wukong release image, so the two can never be confused.
          image="$NAMESPACE/wukong-workbench:local-$VERSION"
          {
            echo "version=$VERSION"
            echo "revision=$revision"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          echo "Preparing $image from $revision ($SOURCE_REF); no official release image or latest tag is touched."
      - name: Prepare runner disk
        run: bash scripts/ci/prepare-ci-disk.sh 25
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workers/deps
          key: worker-deps-v1-${{ hashFiles('workers/toolchain.lock.json') }}
      - name: Verify locked build inputs, including cache hits
        run: python -m scripts.toolchain.fetch_worker_deps
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Refuse to overwrite an already published version tag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE already exists; version tags are immutable. Bump the client version for incompatible changes and rerun; a successful earlier run needs no republish."
            exit 1
          fi
          echo "$IMAGE is not published yet."
      - name: Build the workbench image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          set -euo pipefail
          docker buildx bake --load \
            --set workbench.tags="$IMAGE" \
            --set workbench.args.VERSION="$VERSION" \
            --set workbench.args.REVISION="$REVISION"
      - name: Verify the loaded image before publishing
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")
          if [[ "$platform" != linux/amd64 ]]; then
            echo "::error::$IMAGE is $platform; the desktop requires linux/amd64."
            exit 1
          fi
          docker run --rm --entrypoint python3 "$IMAGE" -c \
            'import pwn, angr, elftools, pygdbmi; print("workbench tool imports OK")'
          df -h /
      - name: Publish the immutable version tag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ steps.meta.outputs.revision }}
          SOURCE_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          digest=${digest#*@}
          size=$(docker image inspect --format '{{.Size}}' "$IMAGE")
          {
            echo "## Workbench image published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Digest | \`$digest\` |"
            echo "| Size | $size bytes ($((size / 1024 / 1024)) MiB) |"
            echo "| Client version | $VERSION |"
            echo "| Source revision | \`$REVISION\` |"
            echo "| Source ref | \`$SOURCE_REF\` |"
            echo "| Actor | @${{ github.actor }} |"
            echo "| Run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "This is the separate workbench repository; the official release image and its tags are untouched. Builders run \`cargo package-local\` and pull \`local-$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
