name: Prepare Version PR
run-name: Prepare ${{ inputs.tag }}${{ inputs.dry_run && ' (dry run)' || '' }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version tag, e.g. v0.2.0 (must exceed the current version)'
        type: string
        required: true
      dry_run:
        description: 'Validate and show the version diff without creating a branch or PR'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require master workflow
        run: test "$GITHUB_REF" = refs/heads/master
      - name: Require release App configuration
        if: ${{ !inputs.dry_run }}
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo '::error::Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY; see docs/development/releases.md.'
            exit 1
          fi
      - name: Create repository-scoped release App token
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Synchronize versions and validate
        run: |
          python -m scripts.release.cli bump --tag "$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          python -m scripts.release.cli check --tag "$RELEASE_TAG"
          python -m unittest discover -s tests/automation -p 'test_*.py' -v
          git diff --check
          {
            echo "## Prepare $RELEASE_TAG"
            echo "Base master commit: $(git rev-parse HEAD)"
            echo '```diff'
            git diff -- Cargo.toml Cargo.lock tauri.conf.json ui/package.json package-lock.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create version branch and pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          branch="codex/release-$RELEASE_TAG"
          # Never force-push or overwrite an existing branch. A retry may reuse
          # it only if its entire tree matches the prepared version exactly.
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git diff --exit-code "origin/$branch" --
          else
            git switch -c "$branch"
            git config user.name "$APP_SLUG[bot]"
            git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock tauri.conf.json ui/package.json package-lock.json
            git commit -m "release: prepare $RELEASE_TAG"
            git push origin "HEAD:refs/heads/$branch"
          fi
          pr=$(gh pr list --base master --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr" ]]; then
            cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          Prepare $RELEASE_TAG by synchronizing the application version in Cargo, Tauri and npm manifests and lockfiles. Dependency versions are unchanged.

          Version consistency, release script tests and diff checks passed. This PR is created by the release GitHub App so normal pull_request CI starts automatically and appears on the PR. Wait for Windows, Linux and summary to pass before merging into master.

          Merging this version PR approves publication. Once full CI passes on the merge commit in master, Tag Merged Release validates the version-only change and automatically pushes $RELEASE_TAG at that exact commit. Build and Publish then builds, validates and publishes Docker Hub and GitHub Release artifacts. No manual tag push is needed.
          EOF
            pr=$(gh pr create --base master --head "$branch" --title "release: prepare $RELEASE_TAG" --body-file "$RUNNER_TEMP/release-pr.md")
          fi
          echo "Version PR: $pr" >> "$GITHUB_STEP_SUMMARY"
          echo 'Native PR CI starts through the release App. Merge approves automatic tagging and publication after master CI passes.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize dry run
        if: inputs.dry_run
        run: echo 'Dry run passed. No remote branch, PR, tag, image or release was created.' >> "$GITHUB_STEP_SUMMARY"
