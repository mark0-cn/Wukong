name: 准备版本 PR
run-name: Prepare ${{ inputs.tag }}${{ inputs.dry_run && ' (dry run)' || '' }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version tag, e.g. v0.2.0 (must exceed the current version)'
        type: string
        required: true
      dry_run:
        description: 'Validate and show the version diff without creating a branch or PR'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write # Explicit CI dispatch; bot pushes do not reliably start CI.
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require master workflow
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Synchronize versions and validate
        run: |
          python scripts/release.py bump --tag "$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          python scripts/release.py check --tag "$RELEASE_TAG"
          python -m unittest discover -s scripts -p 'test_*.py' -v
          git diff --check
          {
            echo "## Prepare $RELEASE_TAG"
            echo "Base master commit: $(git rev-parse HEAD)"
            echo '```diff'
            git diff -- Cargo.toml Cargo.lock tauri.conf.json ui/package.json package-lock.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create version branch and pull request
        if: ${{ !inputs.dry_run }}
        run: |
          branch="codex/release-$RELEASE_TAG"
          # Never force-push or overwrite an existing branch. A retry may reuse
          # it only if its entire tree matches the prepared version exactly.
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git diff --exit-code "origin/$branch" --
          else
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.toml Cargo.lock tauri.conf.json ui/package.json package-lock.json
            git commit -m "release: prepare $RELEASE_TAG"
            git push origin "HEAD:refs/heads/$branch"
          fi
          pr=$(gh pr list --base master --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pr" ]]; then
            cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          Prepare $RELEASE_TAG by synchronizing the application version in Cargo, Tauri and npm manifests and lockfiles. Dependency versions are unchanged.

          Version consistency, release script tests and diff checks passed. The preparation workflow explicitly dispatches full CI for this branch; wait for both Windows and Linux checks before merging into master.

          This PR does not publish a release. After merging, update local master and push the matching tag to start the existing Docker Hub and GitHub Release pipeline:

          \`\`\`sh
          git switch master
          git pull --ff-only origin master
          python scripts/release.py check --tag $RELEASE_TAG
          git tag -a $RELEASE_TAG -m "Release $RELEASE_TAG"
          git push origin $RELEASE_TAG
          \`\`\`
          EOF
            pr=$(gh pr create --base master --head "$branch" --title "release: prepare $RELEASE_TAG" --body-file "$RUNNER_TEMP/release-pr.md")
          fi
          echo "Version PR: $pr" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run ci.yml --ref "$branch"
          echo 'Full CI requested for the version branch. Review and merge the PR before tagging; no release has been published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize dry run
        if: inputs.dry_run
        run: echo 'Dry run passed. No remote branch, PR, tag, image or release was created.' >> "$GITHUB_STEP_SUMMARY"
