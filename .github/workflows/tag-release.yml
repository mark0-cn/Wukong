name: Tag Merged Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Inspect tag eligibility' || 'Tag eligible version merge' }} · CI ${{ github.event.workflow_run.id || inputs.ci_run_id }}
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Successful master push CI run to inspect (dry run only; never creates a tag)'
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-tag-${{ github.event.workflow_run.head_sha || inputs.ci_run_id }}
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require master for manual inspection
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/master
      # Never execute scripts or download artifacts from the triggering run.
      # Read trusted master tooling; inspect the candidate's manifests as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate full CI and the exact merged version change
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: python scripts/tag_release.py discover --run-id "$CI_RUN_ID"
      - name: Require release App configuration
        if: steps.candidate.outputs.eligible == 'true' && github.event_name == 'workflow_run'
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo '::error::Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY; see docs/development/releases.md.'
            exit 1
          fi
      - name: Create repository-scoped release App token
        if: steps.candidate.outputs.eligible == 'true' && github.event_name == 'workflow_run'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify App author and push the release tag
        if: steps.candidate.outputs.eligible == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PR_AUTHOR: ${{ steps.candidate.outputs.author }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          MERGE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          test "$PR_AUTHOR" = "$APP_SLUG[bot]"
          gh auth setup-git
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          result=$(python scripts/tag_release.py push --tag "$RELEASE_TAG" --sha "$MERGE_SHA")
          echo "Tag $RELEASE_TAG: $result at $MERGE_SHA. New App-pushed tags trigger Build and Publish." >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize manual inspection
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Dry run only. No App token was issued and no tag or release was created.' >> "$GITHUB_STEP_SUMMARY"
