name: Toolchain updates
on:
  schedule:
    - cron: '23 2 * * 1' # Monday 10:23 Asia/Shanghai; GitHub schedules may be delayed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-updates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compare locked tools with upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-toolchain-updates.py
      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          if [[ -f toolchain-report/report.md ]]; then
            cat toolchain-report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Toolchain check did not produce a report. Inspect the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: toolchain-update-report
          path: toolchain-report/
          retention-days: 30
          if-no-files-found: warn
