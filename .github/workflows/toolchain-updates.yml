name: Toolchain updates
on:
  schedule:
    - cron: '23 2 * * 1' # Monday 10:23 Asia/Shanghai; GitHub schedules may be delayed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-updates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compare locked tools with upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-toolchain-updates.py
      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          if [[ -f toolchain-report/report.md ]]; then
            cat toolchain-report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Toolchain check did not produce a report. Inspect the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: toolchain-update-report
          path: toolchain-report/
          retention-days: 30
          if-no-files-found: warn
