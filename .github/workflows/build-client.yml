name: Build Client
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.target == 'windows' && 'windows-2025' || (inputs.target == 'linux-desktop' && 'ubuntu-22.04' || 'ubuntu-24.04') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate target and trusted source
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$TARGET" == windows || "$TARGET" == linux || "$TARGET" == linux-desktop ]]
          git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.target != 'linux'
        with:
          node-version: '22'
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ inputs.target }}-client-v1
          # Master prebuilds seed caches that later tags can restore.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Linux desktop build dependencies
        if: inputs.target == 'linux-desktop'
        timeout-minutes: 12
        run: python -m scripts.ci.install_apt libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libwayland-dev libxkbcommon-dev
      - name: Build embedded desktop release
        if: inputs.target != 'linux'
        shell: bash
        run: |
          npm ci
          npm run build
          cargo build --locked --release --features custom-protocol
          ./target/release/wukong --version
      - name: Install Linux acceptance build dependencies
        if: inputs.target == 'linux'
        timeout-minutes: 12
        run: python -m scripts.ci.install_apt libwayland-dev libxkbcommon-dev
      - name: Build Linux acceptance CLI
        if: inputs.target == 'linux'
        env:
          CARGO_PROFILE_DEV_DEBUG: '1'
        shell: bash
        run: |
          cargo build --locked --no-default-features
          ./target/debug/wukong --version
      - name: Stage verified client
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python -m scripts.release.client_artifact stage --target "$TARGET" --directory client-artifact
          python -m scripts.release.client_artifact verify --target "$TARGET" --directory client-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.target == 'windows' && 'windows-client-v1' || (inputs.target == 'linux-desktop' && 'linux-desktop-client-v1' || 'linux-acceptance-client-v1') }}
          path: client-artifact/
          compression-level: 1
          overwrite: true
          retention-days: 14
          if-no-files-found: error
