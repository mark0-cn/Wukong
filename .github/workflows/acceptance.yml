name: Acceptance
run-name: Acceptance · ${{ inputs.suite || 'selected checks' }} · ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Hosted acceptance suite (all includes native worker installation)'
        type: choice
        options: [all, apt, uninstall, windows-worker]
        default: all
  workflow_call:
    inputs:
      apt:
        type: boolean
        default: false
      uninstall:
        type: boolean
        default: false
      suite:
        type: string
        default: selected
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apt:
    if: inputs.apt || inputs.suite == 'all' || inputs.suite == 'apt'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install real packages and reject a failed index download
        timeout-minutes: 12
        run: python tests/acceptance/check_ci_apt.py

  uninstall:
    if: inputs.uninstall || inputs.suite == 'all' || inputs.suite == 'uninstall'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: uninstall-native-v1
          # GitHub isolates pull-request caches; production never reuses these artifacts.
          save-if: true
          cache-on-failure: true
      - name: Build unsigned native acceptance package
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --features custom-protocol -j 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx --no-install tauri bundle --debug --ci --features custom-protocol --bundles nsis --no-sign
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test actual NSIS installation and scoped uninstall on disposable runner
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem target/debug/bundle/nsis/*-setup.exe)
          if ($packages.Count -ne 1) { throw 'Expected one NSIS package' }
          python tests/acceptance/check_cleanup.py --installer $packages[0].FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  windows-worker:
    if: inputs.suite == 'all' || inputs.suite == 'windows-worker'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build and check native worker components
        id: worker_native
        shell: pwsh
        run: ./scripts/ci/check_windows_worker.ps1
      - name: Dedicated hosted Windows worker installation acceptance
        id: worker_acceptance
        if: ${{ !cancelled() && steps.worker_native.outcome == 'success' }}
        shell: pwsh
        run: |
          python tests/acceptance/check_windows_worker.py --confirm-hosted-runner --report target/windows-worker-acceptance/report.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve public native installation report
        if: always() && (steps.worker_acceptance.outcome == 'success' || steps.worker_acceptance.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-worker-installation-report
          path: target/windows-worker-acceptance/report.json
          if-no-files-found: error
          retention-days: 7

  acceptance-gate:
    if: always()
    needs: [apt, uninstall, windows-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require every requested acceptance result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SUITE: ${{ inputs.suite || 'selected' }}
          APT: ${{ inputs.apt || false }}
          UNINSTALL: ${{ inputs.uninstall || false }}
        run: python -m scripts.ci.acceptance_gate
