name: Checks
run-name: Checks · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }} · ${{ github.sha }}
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_release_clients:
        description: 'Prebuild release clients and seed master caches (no publication)'
        type: boolean
        default: false
      windows_worker_acceptance:
        description: 'Install and test the native worker only on the disposable hosted Windows runner'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let master finish and populate caches; superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      frontend: ${{ steps.scope.outputs.frontend }}
      linux: ${{ steps.scope.outputs.linux }}
      reason: ${{ steps.scope.outputs.reason }}
      release_clients: ${{ steps.scope.outputs.release_clients }}
      apt: ${{ steps.scope.outputs.apt }}
      uninstall: ${{ steps.scope.outputs.uninstall }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install documentation automation dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
      - name: Select checks from the complete PR or master change range
        id: scope
        env:
          BUILD_RELEASE_CLIENTS: ${{ inputs.build_release_clients || false }}
          WINDOWS_WORKER_ACCEPTANCE: ${{ inputs.windows_worker_acceptance == true || contains(github.event.pull_request.labels.*.name, 'windows-worker-acceptance') }}
          FORCE_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.ci.ci_scope
      - name: Documentation pairs, links and review records
        run: python -m scripts.ci.check_docs
      - name: Python formatting and static checks
        run: |
          python -m pip install --disable-pip-version-check -r scripts/dev/requirements.txt
          python -m ruff format --check workers scripts tests evals fixtures
          python -m ruff check workers scripts tests evals fixtures

  windows:
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.linux == 'true') && needs.changes.outputs.reuse != 'true'
    env:
      # CI-only: retain line information while reducing debug data and cache size.
      # Keep assertions/overflow checks and the local/release profiles unchanged.
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    outputs:
      rust_cache_hit: ${{ steps.rust-cache.outputs.cache-hit }}
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        name: Rust cache
        if: needs.changes.outputs.rust == 'true'
        id: rust-cache
        with:
          shared-key: windows-checks-v2
          save-if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      - name: Cold native dependency preflight
        id: native_preflight
        if: needs.changes.outputs.rust == 'true'
        run: python -m scripts.dev.msvc_cargo --native-preflight --preflight-target "$env:RUNNER_TEMP/wukong-native-preflight"
      - name: Preserve bounded native build-script diagnostics
        if: failure() && steps.native_preflight.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-build-diagnostics
          path: |
            ${{ runner.temp }}/wukong-native-preflight/debug/build/aws-lc-sys-*/output
            ${{ runner.temp }}/wukong-native-preflight/debug/build/aws-lc-sys-*/stderr
            ${{ runner.temp }}/wukong-native-preflight/debug/build/ring-*/output
            ${{ runner.temp }}/wukong-native-preflight/debug/build/ring-*/stderr
            ${{ runner.temp }}/wukong-native-preflight/debug/build/libsqlite3-sys-*/output
            ${{ runner.temp }}/wukong-native-preflight/debug/build/libsqlite3-sys-*/stderr
          if-no-files-found: ignore
          retention-days: 7
      - name: Version and release tooling tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m scripts.release.cli check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/automation -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tests/automation/test-online-package.ps1
          ./tests/automation/test-installer.ps1
      - name: Windows Python worker tests
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.linux == 'true'
        run: |
          python -m pip install --disable-pip-version-check -e workers/analysis -r workers/runtime/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python workers/tests/run.py unit -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:e2e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust Clippy
        if: needs.changes.outputs.rust == 'true'
        run: |
          python -m scripts.dev.msvc_cargo -- clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          python -m scripts.dev.msvc_cargo -- test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  windows-worker:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.reuse != 'true'
    env:
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    outputs:
      rust_cache_hit: ${{ steps.rust-cache.outputs.cache-hit }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        name: Rust cache
        id: rust-cache
        with:
          shared-key: windows-worker-checks-v1
          workspaces: |
            workers/windows -> target/windows-worker-native
            workers/package -> target/worker-package-checks
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      - name: Standalone Windows worker bootstrap
        id: worker_native
        if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
        run: ./scripts/ci/check_windows_worker.ps1

      - name: Dedicated hosted Windows worker installation acceptance
        id: worker_acceptance
        if: ${{ !cancelled() && steps.worker_native.outcome == 'success' && (inputs.windows_worker_acceptance == true || contains(github.event.pull_request.labels.*.name, 'windows-worker-acceptance')) }}
        run: |
          python tests/acceptance/check_windows_worker.py --confirm-hosted-runner --report target/windows-worker-acceptance/report.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve public native installation report
        if: always() && (steps.worker_acceptance.outcome == 'success' || steps.worker_acceptance.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-worker-installation-report
          path: target/windows-worker-acceptance/report.json
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.changes.outputs.rust == 'true'
        with:
          shared-key: linux-desktop-checks-v1
          save-if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      - name: Prepare required Linux test dependencies
        timeout-minutes: 12
        env:
          DESKTOP_TESTS: ${{ needs.changes.outputs.rust }}
        run: |
          packages=(gdb patchelf gcc-multilib musl-tools)
          if [[ "$DESKTOP_TESTS" == 'true' ]]; then
            packages+=(libwayland-dev libxkbcommon-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb)
          fi
          python -m scripts.ci.install_apt "${packages[@]}"
      - name: Python runtime and release tests
        run: |
          python -m pip install -e workers/analysis -r workers/runtime/requirements.txt -r scripts/ci/requirements.txt pyelftools
          python -m compileall -q workers/runtime scripts
          python -m unittest discover -s tests/automation -p 'test_*.py' -v
          python workers/tests/run.py unit -p 'test_*.py' -v
          python -m evals.tests.test_analysis
          python -m evals.tests.test_compare_runs
          python -m evals.tests.test_pwn
          python -m evals.pwn.evaluate --build-dir "$RUNNER_TEMP/pwn-fixtures" --require-all
          python -m evals.analysis.evaluate --build-dir "$RUNNER_TEMP/analysis-fixtures"
          sh fixtures/build.sh "$RUNNER_TEMP/vulnerability-fixtures"
          python -m evals.vulnerability.evaluate --build-dir "$RUNNER_TEMP/vulnerability-fixtures" --repetitions 1
      - name: Linux desktop feature tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo test --locked --all-targets
          cargo build --locked
          python tests/acceptance/check_cleanup.py --binary target/debug/wukong
      - name: Offline worker package format
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo fmt --manifest-path workers/package/Cargo.toml -- --check
          cargo clippy --locked --manifest-path workers/package/Cargo.toml --all-targets --target-dir target/worker-package-checks -- -D warnings
          cargo test --locked --manifest-path workers/package/Cargo.toml --all-targets --target-dir target/worker-package-checks
      - name: Linux bilingual interface tests
        if: needs.changes.outputs.frontend == 'true'
        timeout-minutes: 15
        run: |
          npm ci
          npm test
          npm run build
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify replay between sibling containers
        run: |
          docker build --tag wukong-network-acceptance \
            --file tests/acceptance/network.Dockerfile .
          python tests/acceptance/check_network_verify.py \
            --image wukong-network-acceptance \
            --output-dir "$RUNNER_TEMP/pwn-network"
      - name: Preserve Pwn fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwn-fixture-evidence
          path: |
            ${{ runner.temp }}/pwn-fixtures/
            ${{ runner.temp }}/pwn-network/
          if-no-files-found: ignore
          retention-days: 14

  acceptance:
    needs: changes
    if: (needs.changes.outputs.apt == 'true' || needs.changes.outputs.uninstall == 'true') && needs.changes.outputs.reuse != 'true'
    uses: ./.github/workflows/acceptance.yml
    with:
      apt: ${{ needs.changes.outputs.apt == 'true' }}
      uninstall: ${{ needs.changes.outputs.uninstall == 'true' }}

  windows-client:
    needs: changes
    if: needs.changes.outputs.release_clients == 'true' && needs.changes.outputs.reuse != 'true'
    uses: ./.github/workflows/build-client.yml
    with:
      target: windows

  linux-client:
    needs: changes
    if: needs.changes.outputs.release_clients == 'true' && needs.changes.outputs.reuse != 'true'
    uses: ./.github/workflows/build-client.yml
    with:
      target: linux

  linux-desktop-client:
    needs: changes
    if: needs.changes.outputs.release_clients == 'true' && needs.changes.outputs.reuse != 'true'
    uses: ./.github/workflows/build-client.yml
    with:
      target: linux-desktop

  summary:
    if: always()
    needs: [changes, windows, windows-worker, linux, acceptance, windows-client, linux-client, linux-desktop-client]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Summarize checks, including failures
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci.actions_summary --kind ci
      - name: Require every selected check to pass
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python -c 'import json, os, sys; from scripts.ci.ci_scope import checks_passed; sys.exit(0 if checks_passed(json.loads(os.environ["NEEDS_JSON"])) else 1)'
      - name: Write optional reusable test attestation
        id: attestation
        if: success() && github.event_name == 'pull_request' && needs.changes.outputs.reuse == 'false'
        continue-on-error: true # Evidence availability must not change this run's required result.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci.ci_reuse write --output target/ci-attestation/ci-result.json
      - name: Upload optional reusable test attestation
        if: steps.attestation.outcome == 'success'
        continue-on-error: true # A later run falls back to full checks when evidence is unavailable.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-attestation-v1
          path: target/ci-attestation/ci-result.json
          if-no-files-found: error
          retention-days: 7

  release-request:
    needs: [changes, summary]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.workflow == 'Checks' && needs.changes.outputs.release_clients == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Request publication eligibility for the exact version merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release.request_release
