name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let master finish and populate caches; superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      frontend: ${{ steps.scope.outputs.frontend }}
      linux: ${{ steps.scope.outputs.linux }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select checks (full for master, releases and manual runs)
        id: scope
        run: python scripts/ci_scope.py

  windows:
    needs: changes
    env:
      # CI-only: retain line information while reducing debug data and cache size.
      # Keep assertions/overflow checks and the local/release profiles unchanged.
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    outputs:
      rust_cache_hit: ${{ steps.rust-cache.outputs.cache-hit }}
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        name: Rust cache
        if: needs.changes.outputs.rust == 'true'
        id: rust-cache
        with:
          shared-key: windows-checks-v2
          save-if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      - name: Version and release tooling tests
        run: |
          python scripts/release.py check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-online-package.ps1
          ./scripts/test-installer.ps1
      - name: Frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust Clippy
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Python runtime and release tests
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb patchelf gcc-multilib libwayland-dev libxkbcommon-dev
          python -m pip install -r workers/runtime/requirements.txt pyelftools
          python -m compileall -q workers/runtime scripts
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python -m unittest discover -s workers/runtime -p 'test_*.py' -v
          python fixtures/analysis/test_analysis.py
          python fixtures/analysis/test_compare_runs.py

  summary:
    if: always()
    needs: [changes, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Summarize checks, including failures
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/actions-summary.py --kind ci
      - name: Require every selected check to pass
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python -c 'import json, os, sys; sys.path.insert(0, "scripts"); from ci_scope import checks_passed; sys.exit(0 if checks_passed(json.loads(os.environ["NEEDS_JSON"])) else 1)'
