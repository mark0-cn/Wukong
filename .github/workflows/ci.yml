name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }} · ${{ github.sha }}
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_release_clients:
        description: 'Prebuild release clients and seed master caches (no publication)'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let master finish and populate caches; superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      frontend: ${{ steps.scope.outputs.frontend }}
      linux: ${{ steps.scope.outputs.linux }}
      reason: ${{ steps.scope.outputs.reason }}
      release_clients: ${{ steps.scope.outputs.release_clients }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select checks (full for master, releases and manual runs)
        id: scope
        env:
          BUILD_RELEASE_CLIENTS: ${{ inputs.build_release_clients || false }}
        run: python -m scripts.ci.ci_scope
      - name: Documentation pairs, links and review records
        run: python -m scripts.ci.check_docs

  windows:
    needs: changes
    env:
      # CI-only: retain line information while reducing debug data and cache size.
      # Keep assertions/overflow checks and the local/release profiles unchanged.
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    outputs:
      rust_cache_hit: ${{ steps.rust-cache.outputs.cache-hit }}
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        name: Rust cache
        if: needs.changes.outputs.rust == 'true'
        id: rust-cache
        with:
          shared-key: windows-checks-v2
          save-if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      - name: Version and release tooling tests
        run: |
          python -m scripts.release.cli check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/automation -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tests/automation/test-online-package.ps1
          ./tests/automation/test-installer.ps1
      - name: Frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:e2e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust Clippy
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Standalone Windows worker bootstrap
        if: needs.changes.outputs.rust == 'true'
        run: |
          $locator = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $locator -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -or -not $installation) { throw 'MSVC x64 build tools are unavailable' }
          $setup = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $command = '"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $setup
          & cmd.exe /d /c $command | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process') }
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path workers/windows/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path workers/windows/Cargo.toml --all-targets --target-dir target/windows-worker-native -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m scripts.worker.build_native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path workers/package/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path workers/package/Cargo.toml --all-targets --target-dir target/worker-package-checks -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path workers/package/Cargo.toml --all-targets --target-dir target/worker-package-checks
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:WUKONG_WORKER_CLI = Join-Path $PWD 'target/windows-worker-native/x86_64-pc-windows-msvc/release/wukong-worker.exe'
          $env:WUKONG_PACKAGE_CLI = Join-Path $PWD 'target/windows-worker-native/x86_64-pc-windows-msvc/release/wukong-package.exe'
          cargo test --locked --manifest-path workers/package/Cargo.toml --test contract --target-dir target/worker-package-checks -- --ignored
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.changes.outputs.rust == 'true'
        with:
          shared-key: linux-desktop-checks-v1
          save-if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      - name: Python runtime and release tests
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb patchelf gcc-multilib musl-tools libwayland-dev libxkbcommon-dev
          python -m pip install -r workers/runtime/requirements.txt pyelftools
          python -m compileall -q workers/runtime scripts
          python -m unittest discover -s tests/automation -p 'test_*.py' -v
          python workers/tests/run.py unit -p 'test_*.py' -v
          python -m evals.tests.test_analysis
          python -m evals.tests.test_compare_runs
          python -m evals.tests.test_pwn
          python -m evals.pwn.evaluate --build-dir "$RUNNER_TEMP/pwn-fixtures" --require-all
          python -m evals.analysis.evaluate --build-dir "$RUNNER_TEMP/analysis-fixtures"
          sh fixtures/build.sh "$RUNNER_TEMP/vulnerability-fixtures"
          python -m evals.vulnerability.evaluate --build-dir "$RUNNER_TEMP/vulnerability-fixtures" --repetitions 1
      - name: Linux desktop feature tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
          cargo test --locked --all-targets
      - name: Offline worker package format
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo fmt --manifest-path workers/package/Cargo.toml -- --check
          cargo clippy --locked --manifest-path workers/package/Cargo.toml --all-targets --target-dir target/worker-package-checks -- -D warnings
          cargo test --locked --manifest-path workers/package/Cargo.toml --all-targets --target-dir target/worker-package-checks
      - name: Linux bilingual interface tests
        if: needs.changes.outputs.frontend == 'true'
        run: |
          npm ci
          npm test
          npm run build
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify replay between sibling containers
        run: |
          python tests/acceptance/check_network_verify.py \
            --image python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b \
            --output-dir "$RUNNER_TEMP/pwn-network"
      - name: Preserve Pwn fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwn-fixture-evidence
          path: |
            ${{ runner.temp }}/pwn-fixtures/
            ${{ runner.temp }}/pwn-network/
          if-no-files-found: ignore
          retention-days: 14

  windows-client:
    needs: changes
    if: needs.changes.outputs.release_clients == 'true'
    uses: ./.github/workflows/build-client.yml
    with:
      target: windows

  linux-client:
    needs: changes
    if: needs.changes.outputs.release_clients == 'true'
    uses: ./.github/workflows/build-client.yml
    with:
      target: linux

  linux-desktop-client:
    needs: changes
    if: needs.changes.outputs.release_clients == 'true'
    uses: ./.github/workflows/build-client.yml
    with:
      target: linux-desktop

  summary:
    if: always()
    needs: [changes, windows, linux, windows-client, linux-client, linux-desktop-client]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Summarize checks, including failures
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci.actions_summary --kind ci
      - name: Require every selected check to pass
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python -c 'import json, os, sys; from scripts.ci.ci_scope import checks_passed; sys.exit(0 if checks_passed(json.loads(os.environ["NEEDS_JSON"])) else 1)'
