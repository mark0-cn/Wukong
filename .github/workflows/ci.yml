name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          cache-on-failure: true
      - name: Version and release tooling tests
        run: |
          python scripts/release.py check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-online-package.ps1
      - name: Frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build embedded desktop release
        if: inputs.release == true
        run: |
          cargo build --locked --release --features custom-protocol
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./target/release/re-agent.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.release == true
        with:
          name: windows-client
          path: target/release/re-agent.exe
          retention-days: 7
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Python runtime and release tests
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb patchelf gcc-multilib libwayland-dev libxkbcommon-dev
          python -m pip install -r workers/runtime/requirements.txt pyelftools
          python -m compileall -q workers/runtime scripts
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python -m unittest discover -s workers/runtime -p 'test_*.py' -v
          python fixtures/analysis/test_analysis.py
          python fixtures/analysis/test_compare_runs.py
      - name: Build Linux host for container acceptance
        if: inputs.release == true
        run: cargo build --locked --no-default-features
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.release == true
        with:
          name: linux-acceptance-client
          path: target/debug/re-agent
          retention-days: 7
          if-no-files-found: error
