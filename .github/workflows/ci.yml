name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: windows-checks-v1
      - name: Version and release tooling tests
        run: |
          python scripts/release.py check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-online-package.ps1
          ./scripts/test-installer.ps1
      - name: Frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Python runtime and release tests
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb patchelf gcc-multilib libwayland-dev libxkbcommon-dev
          python -m pip install -r workers/runtime/requirements.txt pyelftools
          python -m compileall -q workers/runtime scripts
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python -m unittest discover -s workers/runtime -p 'test_*.py' -v
          python fixtures/analysis/test_analysis.py
          python fixtures/analysis/test_compare_runs.py
