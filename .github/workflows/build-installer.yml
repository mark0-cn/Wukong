name: Build Desktop Installer
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      client_run:
        type: string
        default: ''
      installer_run:
        type: string
        default: ''
      installer_artifact_id:
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ${{ inputs.target == 'windows' && 'windows-2025' || 'ubuntu-22.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require trusted master commit
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$TARGET" == windows || "$TARGET" == linux ]]
          git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.installer_artifact_id == ''
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux desktop build dependencies
        if: inputs.target == 'linux' && inputs.installer_artifact_id == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libwayland-dev libxkbcommon-dev xvfb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.installer_artifact_id == ''
        with:
          name: ${{ inputs.target == 'windows' && 'windows-client-v1' || 'linux-desktop-client-v1' }}
          path: client
          run-id: ${{ inputs.client_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Bundle verified Windows client without recompilation
        if: inputs.target == 'windows' && inputs.installer_artifact_id == ''
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          python -m scripts.release.client_artifact verify --target windows --directory client
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item client/wukong.exe target/release/wukong.exe
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx --no-install tauri bundle --ci --features custom-protocol --config '{"bundle":{"createUpdaterArtifacts":true}}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bundle verified Linux desktop client without recompilation
        if: inputs.target == 'linux' && inputs.installer_artifact_id == ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          python -m scripts.release.client_artifact verify --target linux-desktop --directory client
          mkdir -p target/release
          cp client/wukong target/release/wukong
          chmod +x target/release/wukong
          npm ci
          npx --no-install tauri bundle --ci --features custom-protocol --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Stage and smoke-test native installer
        if: inputs.installer_artifact_id == ''
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: python -m scripts.release.installer_artifact --target "$TARGET" --output installer-artifact
      - name: Download previously validated installer
        if: inputs.installer_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.installer_artifact_id }}
          run-id: ${{ inputs.installer_run }}
          path: installer-artifact
          merge-multiple: true
          github-token: ${{ github.token }}
      - name: Verify reusable installer identity and bytes
        if: inputs.installer_artifact_id != ''
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: python -m scripts.release.installer_identity --target "$TARGET" --directory installer-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.target }}-installer-v1
          path: installer-artifact/
          overwrite: true
          retention-days: 14
          if-no-files-found: error
