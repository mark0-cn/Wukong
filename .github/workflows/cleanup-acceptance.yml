name: Uninstall acceptance
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/cleanup/**'
      - 'src/desktop/cleanup.rs'
      - 'packaging/windows/uninstall-hooks.nsh'
      - 'tauri*.json'
      - 'tests/acceptance/check_cleanup.py'
      - '.github/workflows/cleanup-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanup-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: uninstall-native-v1
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Build unsigned native acceptance package
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --features custom-protocol -j 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx --no-install tauri bundle --debug --ci --features custom-protocol --bundles nsis --no-sign
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test actual NSIS installation and scoped uninstall on disposable runner
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem target/debug/bundle/nsis/*-setup.exe)
          if ($packages.Count -ne 1) { throw 'Expected one NSIS package' }
          python tests/acceptance/check_cleanup.py --installer $packages[0].FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test actual isolated WebView review and confirmation protocol
        shell: pwsh
        run: |
          node tests/acceptance/check_cleanup_ui.mjs target/debug/wukong.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
