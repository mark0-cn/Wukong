name: Commit policy
on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: commit-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  commit-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Validate policy with real commitlint
        run: python -m unittest tests.automation.test_commit_policy tests.automation.test_release_notes -v
      - name: Check PR title, new commits and release summaries
        run: python -m scripts.ci.commit_policy
      - name: Preview PR changes and the next release
        run: python -m scripts.ci.release_preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-description-preview
          path: target/release-description-preview/
          retention-days: 14
          if-no-files-found: error
