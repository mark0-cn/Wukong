name: Build and Publish
run-name: ${{ github.event_name == 'push' && 'Publish' || 'Release rehearsal' }} · ${{ github.ref_name }} · ${{ github.sha }}
on:
  push:
    tags: ['**'] # Check every tag; scripts.release.cli enforces vMAJOR.MINOR.PATCH.
  workflow_dispatch:
    # Manual runs exercise builds and upload candidate artifacts, without publishing a Release.

permissions:
  contents: read
  actions: read

concurrency:
  group: workbench-release
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      candidate: ${{ steps.meta.outputs.candidate }}
      ci_run: ${{ steps.reuse.outputs.ci_run }}
      windows_run: ${{ steps.reuse.outputs.windows_run }}
      linux_run: ${{ steps.reuse.outputs.linux_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate version and source
        id: meta
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=$(python -m scripts.release.cli check --tag "$GITHUB_REF_NAME")
          else
            version=$(python -m scripts.release.cli check)
          fi
          [[ "$NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ && -n "$USERNAME" ]]
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$NAMESPACE/wukong" >> "$GITHUB_OUTPUT"
          echo "candidate=$NAMESPACE/wukong:build-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Find verified checks and client artifacts for this exact commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release.release_reuse

  checks-fallback:
    needs: metadata
    if: needs.metadata.outputs.ci_run == ''
    uses: ./.github/workflows/ci.yml

  checks:
    if: always()
    needs: [metadata, checks-fallback]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require verified prior CI or successful fallback
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          PRIOR_CI: ${{ needs.metadata.outputs.ci_run }}
          FALLBACK_RESULT: ${{ needs.checks-fallback.result }}
        run: |
          test "$METADATA_RESULT" = success
          if [[ -n "$PRIOR_CI" ]]; then
            echo "Reused full master CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CI" >> "$GITHUB_STEP_SUMMARY"
          else
            test "$FALLBACK_RESULT" = success
          fi

  windows-client:
    needs: metadata
    if: needs.metadata.outputs.windows_run == ''
    uses: ./.github/workflows/build-client.yml
    with:
      target: windows

  linux-client:
    needs: metadata
    if: needs.metadata.outputs.linux_run == ''
    uses: ./.github/workflows/build-client.yml
    with:
      target: linux

  image:
    needs: metadata
    runs-on: ${{ vars.WORKBENCH_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reuse candidate on retries
        id: existing
        env:
          CANDIDATE: ${{ needs.metadata.outputs.candidate }}
        run: |
          digest=$(python -m scripts.release.publish_release --inspect-image "$CANDIDATE")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Prepare disk
        if: steps.existing.outputs.digest == ''
        run: |
          bash scripts/ci/prepare-ci-disk.sh 25
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.existing.outputs.digest == ''
        with:
          path: workers/deps
          key: worker-deps-v1-${{ hashFiles('workers/toolchain.lock.json') }}
      - name: Verify locked inputs, including cache hits
        if: steps.existing.outputs.digest == ''
        run: |
          python -m scripts.toolchain.fetch_worker_deps
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        if: steps.existing.outputs.digest == ''
        id: build
        with:
          source: .
          files: docker-bake.hcl
          targets: workbench
          push: true
          provenance: mode=max
          sbom: true
          set: |
            workbench.tags=${{ needs.metadata.outputs.candidate }}
            workbench.args.REVISION=${{ github.sha }}
            workbench.args.VERSION=${{ needs.metadata.outputs.version }}
            *.cache-from=type=registry,ref=${{ needs.metadata.outputs.image }}:buildcache
            workbench.cache-to=type=registry,ref=${{ needs.metadata.outputs.image }}:buildcache,mode=max
      - name: Resolve uploaded digest
        id: digest
        env:
          CANDIDATE: ${{ needs.metadata.outputs.candidate }}
        run: |
          digest=$(python -m scripts.release.publish_release --inspect-image "$CANDIDATE")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          df -h /

  acceptance:
    if: >-
      always() && needs.metadata.result == 'success' && needs.image.result == 'success' &&
      (needs.linux-client.result == 'success' || needs.metadata.outputs.linux_run != '')
    needs: [metadata, image, linux-client]
    runs-on: ${{ vars.WORKBENCH_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-acceptance-client-v1
          path: acceptance-client
          run-id: ${{ needs.metadata.outputs.linux_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded Linux client before execution
        run: python -m scripts.release.client_artifact verify --target linux --directory acceptance-client
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull candidate into a fresh runner
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          bash scripts/ci/prepare-ci-disk.sh 20
          docker pull --platform linux/amd64 "$IMAGE"
          chmod +x acceptance-client/wukong
      - name: Container and CLI acceptance
        shell: bash # Explicit Bash enables pipefail so tee cannot hide a failed network check.
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          mkdir -p validation
          python tests/acceptance/check_workbench.py --image "$IMAGE" | tee validation/networks.txt
          python tests/acceptance/check_release_image.py --image "$IMAGE" --revision "$GITHUB_SHA" --client acceptance-client/wukong --output validation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-validation
          overwrite: true
          path: validation/
          retention-days: 14
          if-no-files-found: warn

  windows-installer:
    if: >-
      always() && needs.metadata.result == 'success' &&
      (needs.windows-client.result == 'success' || needs.metadata.outputs.windows_run != '')
    needs: [metadata, windows-client]
    uses: ./.github/workflows/build-installer.yml
    with:
      target: windows
      client_run: ${{ needs.metadata.outputs.windows_run }}
    secrets: inherit

  linux-installer:
    needs: metadata
    uses: ./.github/workflows/build-installer.yml
    with:
      target: linux
    secrets: inherit

  package:
    if: >-
      always() && needs.metadata.result == 'success' && needs.acceptance.result == 'success' &&
      needs.checks.result == 'success' && needs.windows-installer.result == 'success' && needs.linux-installer.result == 'success'
    needs: [metadata, acceptance, windows-installer, linux-installer, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-acceptance-client-v1
          path: client
          run-id: ${{ needs.metadata.outputs.linux_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded release verifier
        run: |
          python -m scripts.release.client_artifact verify --target linux --directory client
          chmod +x client/wukong
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-installer'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-validation
          path: validation
      - name: Package and verify
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npm ci
          python -m scripts.release.desktop_manifest --directory dist --validation validation
          client/wukong verify-update --directory dist
          cp validation/validation-summary.json validation/doctor.json dist/
          python -m scripts.release.cli checksums dist
          python -m scripts.release.release_report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-report
          path: release-report/
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: online-release
          path: dist/
          compression-level: 0 # Native installers already compress their payloads.
          overwrite: true
          retention-days: 14
          if-no-files-found: error

  publish:
    if: >-
      always() && needs.metadata.result == 'success' && needs.package.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: online-release
          path: dist
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish accepted version, then advance latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release.publish_release --directory dist --tag "$GITHUB_REF_NAME"

  summary:
    if: always()
    needs: [metadata, checks, windows-client, linux-client, windows-installer, linux-installer, image, acceptance, package, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.acceptance.result == 'success' || needs.acceptance.result == 'failure'
        continue-on-error: true # Acceptance can fail before producing a report.
        with:
          name: image-validation
          path: summary-artifacts/validation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.package.result == 'success'
        with:
          name: release-report
          path: summary-artifacts/release
      - name: Summarize release results and downloads
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci.actions_summary --kind release
