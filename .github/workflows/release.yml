name: Release
run-name: Release · ${{ github.event_name == 'push' && 'publish' || inputs.operation || 'rehearse' }} · ${{ github.ref_name }} · ${{ github.sha }}
on:
  push:
    tags: ['**'] # Check every tag; scripts.release.cli enforces vMAJOR.MINOR.PATCH.
  workflow_dispatch:
    inputs:
      operation:
        description: 'Rehearse builds, inspect eligibility, tag an approved version merge, or recover accepted publication'
        type: choice
        options: [rehearse, inspect, tag, recover]
        default: rehearse
      ci_run_id:
        description: 'Source master Checks run ID (inspect/tag)'
        type: string
      ci_run_attempt:
        description: 'Exact source Checks attempt (tag only; supplied by Checks)'
        type: string
      ci_sha:
        description: 'Exact source commit (tag only; supplied by Checks)'
        type: string
      release_run_id:
        description: 'Accepted tag publication run ID (recover only)'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: workbench-release
  cancel-in-progress: false

jobs:
  metadata:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'rehearse' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      candidate: ${{ steps.meta.outputs.candidate }}
      ci_run: ${{ steps.reuse.outputs.ci_run }}
      windows_run: ${{ steps.reuse.outputs.windows_run }}
      linux_run: ${{ steps.reuse.outputs.linux_run }}
      linux_desktop_run: ${{ steps.reuse.outputs.linux_desktop_run }}
      windows_installer_id: ${{ steps.reuse.outputs.windows_installer_id }}
      windows_installer_run: ${{ steps.reuse.outputs.windows_installer_run }}
      linux_installer_id: ${{ steps.reuse.outputs.linux_installer_id }}
      linux_installer_run: ${{ steps.reuse.outputs.linux_installer_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate version and source
        id: meta
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=$(python -m scripts.release.cli check --tag "$GITHUB_REF_NAME")
          else
            version=$(python -m scripts.release.cli check)
          fi
          [[ "$NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ && -n "$USERNAME" ]]
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$NAMESPACE/wukong" >> "$GITHUB_OUTPUT"
          echo "candidate=$NAMESPACE/wukong:build-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Find verified checks and client artifacts for this exact commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release.release_reuse

  checks-fallback:
    permissions:
      contents: read
      actions: write
      pull-requests: read
    needs: metadata
    if: needs.metadata.outputs.ci_run == ''
    uses: ./.github/workflows/ci.yml

  checks:
    if: always() && (github.event_name == 'push' || inputs.operation == 'rehearse')
    needs: [metadata, checks-fallback]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require verified prior CI or successful fallback
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          PRIOR_CI: ${{ needs.metadata.outputs.ci_run }}
          FALLBACK_RESULT: ${{ needs.checks-fallback.result }}
        run: |
          test "$METADATA_RESULT" = success
          if [[ -n "$PRIOR_CI" ]]; then
            echo "Reused full master CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$PRIOR_CI" >> "$GITHUB_STEP_SUMMARY"
          else
            test "$FALLBACK_RESULT" = success
          fi

  windows-worker:
    if: >-
      always() && needs.metadata.result == 'success' && needs.checks.result == 'success'
    needs: [metadata, checks]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build, stage and check offline worker media
        run: ./scripts/ci/check_windows_worker.ps1
      - name: Pack deterministic offline media template
        run: |
          python -m scripts.worker.media pack --template target/windows-worker-media-template --version "${{ needs.metadata.outputs.version }}" --output target/windows-worker-media
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-worker-media-v1
          path: target/windows-worker-media/*.zip
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-worker-media-report-v1
          path: target/windows-worker-media-check.json
          overwrite: true
          retention-days: 14
          if-no-files-found: error

  windows-client:
    needs: metadata
    if: needs.metadata.outputs.windows_run == '' && needs.metadata.outputs.windows_installer_id == ''
    uses: ./.github/workflows/build-client.yml
    with:
      target: windows

  linux-client:
    needs: metadata
    if: needs.metadata.outputs.linux_run == ''
    uses: ./.github/workflows/build-client.yml
    with:
      target: linux

  linux-desktop-client:
    needs: metadata
    if: needs.metadata.outputs.linux_desktop_run == '' && needs.metadata.outputs.linux_installer_id == ''
    uses: ./.github/workflows/build-client.yml
    with:
      target: linux-desktop

  image:
    needs: metadata
    runs-on: ${{ vars.WORKBENCH_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reuse candidate on retries
        id: existing
        env:
          CANDIDATE: ${{ needs.metadata.outputs.candidate }}
        run: |
          digest=$(python -m scripts.release.publish_release --inspect-image "$CANDIDATE")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Prepare disk
        if: steps.existing.outputs.digest == ''
        run: |
          bash scripts/ci/prepare-ci-disk.sh 25
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.existing.outputs.digest == ''
        with:
          path: workers/deps
          key: worker-deps-v1-${{ hashFiles('workers/toolchain.lock.json') }}
      - name: Verify locked inputs, including cache hits
        if: steps.existing.outputs.digest == ''
        run: |
          python -m scripts.toolchain.fetch_worker_deps
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        if: steps.existing.outputs.digest == ''
        id: build
        with:
          source: .
          files: docker-bake.hcl
          targets: workbench
          push: true
          provenance: mode=max
          sbom: true
          set: |
            workbench.tags=${{ needs.metadata.outputs.candidate }}
            workbench.args.REVISION=${{ github.sha }}
            workbench.args.VERSION=${{ needs.metadata.outputs.version }}
            *.cache-from=type=registry,ref=${{ needs.metadata.outputs.image }}:buildcache
            workbench.cache-to=type=registry,ref=${{ needs.metadata.outputs.image }}:buildcache,mode=max
      - name: Resolve uploaded digest
        id: digest
        env:
          CANDIDATE: ${{ needs.metadata.outputs.candidate }}
        run: |
          digest=$(python -m scripts.release.publish_release --inspect-image "$CANDIDATE")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          df -h /

  acceptance:
    if: >-
      always() && needs.metadata.result == 'success' && needs.image.result == 'success' &&
      (needs.linux-client.result == 'success' || needs.metadata.outputs.linux_run != '')
    needs: [metadata, image, linux-client]
    runs-on: ${{ vars.WORKBENCH_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-acceptance-client-v1
          path: acceptance-client
          run-id: ${{ needs.metadata.outputs.linux_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded Linux client before execution
        run: python -m scripts.release.client_artifact verify --target linux --directory acceptance-client
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull candidate into a fresh runner
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          bash scripts/ci/prepare-ci-disk.sh 20
          docker pull --platform linux/amd64 "$IMAGE"
          chmod +x acceptance-client/wukong
      - name: Container and CLI acceptance
        shell: bash # Explicit Bash enables pipefail so tee cannot hide a failed network check.
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          mkdir -p validation
          python tests/acceptance/check_workbench.py --image "$IMAGE" | tee validation/networks.txt
          python tests/acceptance/check_release_image.py --image "$IMAGE" --revision "$GITHUB_SHA" --client acceptance-client/wukong --output validation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-validation
          overwrite: true
          path: validation/
          retention-days: 14
          if-no-files-found: warn

  windows-installer:
    if: >-
      always() && needs.metadata.result == 'success' &&
      (needs.windows-client.result == 'success' || needs.metadata.outputs.windows_run != '' || needs.metadata.outputs.windows_installer_id != '')
    needs: [metadata, windows-client]
    uses: ./.github/workflows/build-installer.yml
    with:
      target: windows
      client_run: ${{ needs.metadata.outputs.windows_run }}
      installer_artifact_id: ${{ needs.metadata.outputs.windows_installer_id }}
      installer_run: ${{ needs.metadata.outputs.windows_installer_run }}
    secrets: inherit

  linux-installer:
    if: >-
      always() && needs.metadata.result == 'success' &&
      (needs.linux-desktop-client.result == 'success' || needs.metadata.outputs.linux_desktop_run != '' || needs.metadata.outputs.linux_installer_id != '')
    needs: [metadata, linux-desktop-client]
    uses: ./.github/workflows/build-installer.yml
    with:
      target: linux
      client_run: ${{ needs.metadata.outputs.linux_desktop_run }}
      installer_artifact_id: ${{ needs.metadata.outputs.linux_installer_id }}
      installer_run: ${{ needs.metadata.outputs.linux_installer_run }}
    secrets: inherit

  package:
    if: >-
      always() && needs.metadata.result == 'success' && needs.acceptance.result == 'success' &&
      needs.checks.result == 'success' && needs.windows-installer.result == 'success' &&
      needs.linux-installer.result == 'success' && needs.windows-worker.result == 'success'
    needs: [metadata, acceptance, windows-installer, linux-installer, windows-worker, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-acceptance-client-v1
          path: client
          run-id: ${{ needs.metadata.outputs.linux_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded release verifier
        run: |
          python -m scripts.release.client_artifact verify --target linux --directory client
          chmod +x client/wukong
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-installer-v1'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-worker-media-v1
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-validation
          path: validation
      - name: Package and verify
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npm ci
          # Internal reuse manifests are not user release assets.
          rm dist/installer-windows.json dist/installer-linux.json
          python -m scripts.release.release_notes --output release-content.md
          python -m scripts.release.desktop_manifest --directory dist --validation validation --content release-content.json
          python -m scripts.release.verify_update --directory dist
          cp validation/validation-summary.json validation/doctor.json dist/
          python -m scripts.release.cli checksums dist
          python -m scripts.release.release_report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-report
          path: release-report/
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: online-release
          path: dist/
          compression-level: 0 # Native installers already compress their payloads.
          overwrite: true
          retention-days: 14
          if-no-files-found: error

  publish:
    if: >-
      always() && needs.metadata.result == 'success' && needs.package.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: online-release
          path: dist
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish accepted version, then advance latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release.publish_release --directory dist --tag "$GITHUB_REF_NAME"

  summary:
    if: always() && (github.event_name == 'push' || inputs.operation == 'rehearse')
    needs: [metadata, checks, windows-client, linux-client, linux-desktop-client, windows-worker, windows-installer, linux-installer, image, acceptance, package, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.acceptance.result == 'success' || needs.acceptance.result == 'failure'
        continue-on-error: true # Acceptance can fail before producing a report.
        with:
          name: image-validation
          path: summary-artifacts/validation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.package.result == 'success'
        with:
          name: release-report
          path: summary-artifacts/release
      - name: Summarize release results and downloads
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.ci.actions_summary --kind release

  tag:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'tag' || inputs.operation == 'inspect')
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require master for manual inspection
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/master
      # Never execute scripts or download artifacts from the triggering run.
      # Read trusted master tooling; inspect the candidate's manifests as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate full CI and the exact merged version change
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          OPERATION: ${{ inputs.operation }}
          CI_SHA: ${{ inputs.ci_sha }}
          CI_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: |
          if [[ "$OPERATION" == tag ]]; then
            python -m scripts.release.tag_release discover --run-id "$CI_RUN_ID" --wait --sha "$CI_SHA" --attempt "$CI_ATTEMPT"
          else
            python -m scripts.release.tag_release discover --run-id "$CI_RUN_ID"
          fi
      - name: Require release App configuration
        if: steps.candidate.outputs.eligible == 'true' && inputs.operation == 'tag'
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo '::error::Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY; see docs/development/releases.md.'
            exit 1
          fi
      - name: Create repository-scoped release App token
        if: steps.candidate.outputs.eligible == 'true' && inputs.operation == 'tag'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify App author and push the release tag
        if: steps.candidate.outputs.eligible == 'true' && inputs.operation == 'tag'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PR_AUTHOR: ${{ steps.candidate.outputs.author }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          MERGE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          test "$PR_AUTHOR" = "$APP_SLUG[bot]"
          gh auth setup-git
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          result=$(python -m scripts.release.tag_release push --tag "$RELEASE_TAG" --sha "$MERGE_SHA")
          echo "Tag $RELEASE_TAG: $result at $MERGE_SHA. New App-pushed tags trigger Release publication." >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize manual inspection
        if: inputs.operation == 'inspect'
        run: echo 'Dry run only. No App token was issued and no tag or release was created.' >> "$GITHUB_STEP_SUMMARY"

  recovery-source:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'recover' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require successful source gates and exact artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run_id }}
        run: python -m scripts.release.recover_publish --run-id "$RELEASE_RUN"
  recovery-publish:
    needs: recovery-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.recovery-source.outputs.sha }}
          fetch-depth: 0
      - name: Require accepted commit on master and unchanged tag
        env:
          RELEASE_TAG: ${{ needs.recovery-source.outputs.tag }}
          RELEASE_SHA: ${{ needs.recovery-source.outputs.sha }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.recovery-source.outputs.artifact_id }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish the original accepted bytes and digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.recovery-source.outputs.tag }}
        run: python -m scripts.release.publish_release --directory dist --tag "$RELEASE_TAG"
