[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first }} ([{{ commit.id | truncate(length=8, end="") }}](https://github.com/mark0-cn/Wukong/commit/{{ commit.id }}))
{% if commit.breaking_description %}  - Migration/impact: {{ commit.breaking_description }}
{% endif %}{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
sort_commits = "oldest"
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
commit_parsers = [
  { message = '^Merge ', skip = true },
  { message = '^release: prepare v', skip = true },
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = '^feat', group = "<!-- 1 -->Features" },
  { message = '^fix', group = "<!-- 2 -->Fixes" },
  { message = '^perf', group = "<!-- 3 -->Performance" },
  { message = '^(build|chore)\(deps', group = "<!-- 4 -->Dependencies" },
  { message = '^docs', group = "<!-- 5 -->Documentation" },
  { message = '^refactor', group = "<!-- 6 -->Refactoring" },
  { message = '.*', group = "<!-- 7 -->Maintenance and other changes" },
]
