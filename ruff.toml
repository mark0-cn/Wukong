required-version = "==0.14.5"
target-version = "py311"
line-length = 100
extend-exclude = ["target", "workers/deps", "benchmarks", "fixtures/analysis/build"]

[lint]
# Syntax, invalid control flow, comparisons and undefined names. Import cleanup
# remains explicit: optional dependencies and helper bootstrap imports have effects.
select = ["E9", "F63", "F7", "F82"]

[format]
line-ending = "lf"
