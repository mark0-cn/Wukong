# Copy to re-agent.toml and set a model/endpoint available to your account.
state_dir = ".re-agent"

[model]
provider = "openai_responses"
model = "your-model-name"
api_key_env = "OPENAI_API_KEY"
# base_url = "https://your-provider.example/v1"
# Optional: role (non-root) agents use this model name instead of `model`,
# with the same provider/endpoint/credentials. Leave unset to share the root
# model. A cheaper/faster model keeps worker agents within their role token
# quotas, e.g. "deepseek-flash" for DeepSeek endpoints.
# role_model = "deepseek-flash"
# Optional: per-request output budget for role agents. Verbose role models
# can hit the root max_tokens and stop with finish_reason=Length; raise the
# budget here (only consulted when role_model is set).
# role_max_tokens = 16384
# Raise max_tokens where your provider supports it: long decompilation and
# code-level answers benefit from a larger response budget.
max_tokens = 8192
request_timeout_secs = 180

[budget]
max_agents = 24
max_depth = 4
max_concurrent_agents = 4
max_turns_per_agent = 40
max_total_tokens = 500000
max_wall_seconds = 3600
# max_usd requires input/output prices below.
# max_usd = 10.0
# Optional per-role share of the run token budget for worker agents
# (defaults are built in: recon 0.25, reverse 0.30, hunter 0.25, fuzz 0.25,
# crash 0.20, exploit 0.45, verifier 0.30, reporter 0.15; floor 10k tokens).
# The root agent is governed by the run budget alone and takes no quota.
# [budget.role_token_shares]
# exploit = 0.5

# Zero prices disable USD accounting. Set real USD-per-million prices to
# enable max_usd budgets and cost estimates.
[pricing]
input_usd_per_million = 0.0
output_usd_per_million = 0.0

[runtime]
backend = "disabled"
state_dir = ".re-agent/worker"
python = "python"
bridge_path = "workers/runtime/bridge.py"
# backend = "docker"
# docker_container = "re-agent-worker"
remote_bridge_path = "/opt/re-agent/runtime/bridge.py"
remote_state_dir = "/state"
# Must cover analysis.timeout_seconds (validated at startup): a shorter
# transport timeout would cut off worker-side Ghidra queries mid-flight.
request_timeout_secs = 300

[analysis]
# Optional local Ghidra launcher; use the version required by your installed JDK.
# ghidra_executable = "C:/tools/ghidra/support/analyzeHeadless.bat"
ghidra_cache_dir = ".re-agent/ghidra"
# timeout_seconds must cover analysis_timeout_seconds (validated at startup).
timeout_seconds = 300
analysis_timeout_seconds = 240
max_cpu = 2

[tools]
# Bounded envelope the model actually receives; complete outputs stay in
# evidence artifacts.
max_output_bytes = 12000
# Sized so a default-length evidence_read (base64 of 8192 bytes) still fits
# inside max_output_bytes without truncating the pagination fields. Reads
# larger than the envelope lose next_offset and friends, so prefer several
# bounded reads.
max_evidence_read_bytes = 8192
timeout_seconds = 360

[execution]
stream = true
model_retries = 2
compact_after_chars = 200000
keep_recent_messages = 12
# Replace large tool-result envelopes in the model context with a short LM
# summary (original bytes stay in evidence; replay stays exact).
summarize_tool_outputs = true
summarize_threshold_chars = 6000
summarize_max_tokens = 400

# Per-role worked-example markdown (<role>.md), appended to each agent's
# prompt as method demonstrations. Values shown are illustrative. The
# repository ships these in demos/; a missing directory simply skips demos.
demos_dir = "demos"

# Third-party MCP stdio server, credentials are environment VARIABLE NAMES.
# [[mcp]]
# name = "analysis"
# command = "your-mcp-server"
# args = []
# env = ["ANALYSIS_SERVICE_TOKEN"]
# timeout_seconds = 60
