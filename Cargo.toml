[package]
name = "re-agent"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
description = "Strix-inspired binary reverse engineering and vulnerability validation agents"
license = "Apache-2.0"

[lib]
name = "re_agent"
path = "src/lib.rs"

[[bin]]
name = "re-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rfd = "0.15"
hex = "0.4"
object = { version = "0.40", features = ["read", "std"] }
regex = "1"
rig = { version = "=0.46.0", features = ["memory", "rmcp"] }
rig-core = "=0.46.0"
rig-ecs = "=0.46.0"
bevy_ecs = "=0.20.0"
rig-harness = "=0.46.0"
rig-basics = { version = "=0.46.0", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.2"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

tempfile = "3"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
jsonrpsee-core = { version = "0.26.0", features = ["async-client"] }
askama = "0.14.0"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-opener = { version = "2", optional = true }

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
