[package]
name = "wukong"
version = "1.0.0"
edition = "2024"
default-run = "wukong"
rust-version = "1.97.1"
description = "Strix-inspired binary reverse engineering and vulnerability validation agents"
license = "Apache-2.0"

[lib]
name = "wukong"
path = "src/lib.rs"

[[bin]]
name = "wukong"
path = "src/main.rs"

[dependencies]
wukong-worker-protocol = { path = "workers/protocol" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "string"] }
futures = "0.3"
rfd = "0.18"
hex = "0.4"
object = { version = "0.40", features = ["read", "std"] }
regex = "1"
rig = { version = "=0.46.0", features = ["memory", "rmcp"] }
rig-core = "=0.46.0"
rig-ecs = "=0.46.0"
bevy_ecs = "=0.20.0"
bevy_tasks = "=0.20.0"
rig-harness = "=0.46.0"
rig-basics = { version = "=0.46.0", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.37", default-features = false }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.2"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
wukong-worker-package = { path = "workers/package" }

tempfile = "3"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
jsonrpsee-core = { version = "0.26.0", features = ["async-client"] }
askama = "0.14.0"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
minisign-verify = "0.3"
semver = "1"
fs2 = "0.4"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
sys-locale = "0.3.2"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Globalization", "Win32_NetworkManagement", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking", "Win32_Networking_WinSock", "Win32_Security_Authorization", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry"] }
# Deterministic release-media archives for the built-in worker media finalizer.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build", "dep:tauri-plugin-updater"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[target.'cfg(windows)'.dev-dependencies]
junction = { version = "2.1", default-features = false }

[lints.clippy]
# Every unsafe block states its invariant; the controller has two FFI blocks and the
# Windows worker documented all 306 of its own.
undocumented_unsafe_blocks = "warn"
# Debug leftovers and unfinished markers must not reach a release build.
dbg_macro = "warn"
todo = "warn"
# A suppression without a reason is an unexplained contract change.
allow_attributes_without_reason = "warn"
# Prefer `?` where a caller can act on the failure; an intentional panic uses
# `expect` with the invariant that makes it impossible. Tests are exempt.
unwrap_used = "warn"
# A narrowing cast silently keeps the low bits; convert with `try_from` or state
# the bound that makes the cast lossless.
cast_possible_truncation = "warn"
