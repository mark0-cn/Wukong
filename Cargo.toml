[package]
name = "re-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Strix-inspired binary reverse engineering and vulnerability validation agents"
license = "Apache-2.0"

[lib]
name = "re_agent"
path = "src/lib.rs"

[[bin]]
name = "re-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
futures = "0.3"
hex = "0.4"
object = { version = "0.40", features = ["read", "std"] }
ratatui = { version = "0.30.2", features = ["crossterm"] }
ratatui-textarea = "0.9.4"
regex = "1"
rig = "=0.46.0"
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
