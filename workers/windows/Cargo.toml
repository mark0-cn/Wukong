[package]
name = "wukong-windows-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"

[lib]
path = "native/lib.rs"

[workspace]

[[bin]]
name = "wukong-dbgeng"
path = "native/dbgeng_main.rs"

[[bin]]
name = "wukong-worker"
path = "native/main.rs"

[[bin]]
name = "wukong-package"
path = "native/package_main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zeroize = "1"
tokio = { version = "1.54", features = ["io-util", "io-std", "net", "macros", "process", "rt-multi-thread", "sync", "time"] }
wukong-worker-package = { path = "../package" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Diagnostics_Debug_Extensions", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_Threading", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_Environment", "Win32_System_Services", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_NetManagement"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
