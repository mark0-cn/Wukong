[package]
name = "wukong-windows-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"

[lib]
path = "native/lib.rs"

[workspace]

[[bin]]
name = "wukong-worker"
path = "native/main.rs"

[[bin]]
name = "wukong-package"
path = "native/package_main.rs"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", features = ["sink"] }
prost = "0.14"
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-async-rw"] }
tokio-util = { version = "0.7", features = ["codec"] }
base64 = "0.22"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zeroize = "1"
socket2 = "0.6.5"
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }
tokio = { version = "1.54", features = ["fs", "io-util", "io-std", "net", "macros", "process", "rt-multi-thread", "sync", "time"] }
wukong-worker-package = { path = "../package" }

[target.'cfg(windows)'.dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.62", features = ["Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_StationsAndDesktops", "Win32_System_Environment", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Rpc", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WindowsFilteringPlatform"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dev-dependencies]
junction = { version = "2.1", default-features = false }
