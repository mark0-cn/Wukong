kind = "security"
en = "Validate raw GDB/MI arguments before isolated debugging and dump inspection. Reject debugger-side function calls and encoded command arguments while retaining structured inspection/control and simple register, symbol and memory expressions."
zh_CN = "隔离调试和转储检查会先校验原始 GDB/MI 参数，拒绝调试器侧函数调用及编码命令参数，同时保留结构化检查/控制和简单寄存器、符号、内存表达式。"
