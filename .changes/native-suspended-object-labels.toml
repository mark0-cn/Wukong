en = "Apply and verify low-integrity process and thread labels through held suspended-child handles after checking their owner and DACL. Use only filtered child profile paths and remove unnecessary creator-environment mutation. Local tests verify both labels before fixture execution; dedicated runtime qualification remains pending."
zh_CN = "核对所有者和 DACL 后，通过挂起子进程的持有句柄设置并验证进程及线程的低完整性标签。仅使用筛选后的子进程 profile 路径，移除不必要的创建者环境切换。本地测试在夹具执行前核对两种对象的标签；仍待完成真实运行资格检查。"
