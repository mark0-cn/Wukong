kind = "fix"
en = "Preserve the actual fault context when matching unhandled x86 crashes through WinDbg under WOW64. Require both exception stops to agree on thread and exception identity before accepting a minimized input."
zh_CN = "通过 WinDbg 匹配 WOW64 下未处理的 x86 崩溃时保留真实故障上下文。只有两次异常停止的线程及异常身份一致，才接受缩减输入。"
