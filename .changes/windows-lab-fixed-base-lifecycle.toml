kind = "feat"
en = "Use the fixed `wukong_base_vm` snapshot as every Windows Lab preparation's restore boundary. Optional finalized `worker_media` enables signed same-installation worker upgrades with higher semantic versions and enrollment generations; the old base is retained until the upgraded worker boots and passes an identity-matched doctor check. Publication then reverts the verified staged state, deletes the old base, records that irreversible retirement, captures a new fixed base, and removes the staged snapshot before rebooting for analysis. Failed upgrades before retirement retain the old base's settled provenance for rollback and retry; after retirement, failed reconciliation is refused rather than inventing a rollback. Interrupted transitions require explicit reconciliation, and pruning removes only unused experiment or receipt-proven operation-owned staging snapshots. The configurable baseline field and schema-2 lab-state compatibility path are removed; use a freshly provisioned lab."
zh_CN = "Windows Lab 每次准备都恢复到固定的 `wukong_base_vm` 快照。可选的最终 `worker_media` 支持同一安装的签名 Worker 升级，要求更高的语义版本和登记代际；旧基线保留到升级 Worker 启动并通过身份匹配的 doctor 检查。发布随后恢复已验证的暂存状态，删除旧基线，记录这一不可撤销的退役，捕获新的固定基线并删除暂存快照，再重启开始分析。退役前升级失败会保留旧基线已稳定的部署凭据，支持回滚和重试；退役后拒绝以失败调和，不虚构回滚。中断的切换必须显式调和；清理只删除闲置实验快照或有回执证明归属的暂存快照。删除可配置基线字段和 schema-2 Lab 状态兼容路径；请使用重新部署的实验环境。"
