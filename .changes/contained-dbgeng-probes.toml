kind = "security"
en = "Require fixed x64/x86 DbgEng attachment probes with separately contained target and debugger identities, resource-specific process/thread permissions and verified Job/profile cleanup. Production execution remains disabled pending native admission and VM acceptance."
zh_CN = "增加固定 x64/x86 DbgEng 附加探针，目标与调试器分别隔离，进程和线程权限限定到具体资源身份，并核验 Job 与 profile 清理。原生准入及 VM 验收完成前继续禁用生产执行。"
