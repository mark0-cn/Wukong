kind = "fix"
en = "Local `cargo package-local` builds now fall back to the repository's `target/tmp` directory when the inherited Windows TMP/TEMP directory is not writable for child compiler and linker processes, instead of failing with LNK1104."
zh_CN = "本机 `cargo package-local` 构建在继承的 Windows TMP/TEMP 目录对子编译器/链接器进程不可写时，会回退到仓库的 `target/tmp` 目录，而不再以 LNK1104 失败。"