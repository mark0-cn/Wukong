kind = "feature"
en = "The desktop app now shows a Windows Worker card in Workspace settings under Environments. Its two primary actions generate the offline, controller-credential-free installer package and import the saved install result. The card auto-selects the management network, lets the operator choose a local template when the release publishes none, requires the VM-displayed host fingerprint to be confirmed independently, and reports generated, waiting-for-connection and available states with retry, re-import and host-key-mismatch guidance. User documentation covers the VM workflow and trust limits."
zh_CN = "桌面应用在工作区设置的“分析环境”中新增 Windows Worker 卡片。它的两个主要操作分别生成不含控制端凭据的离线安装包，以及导入保存的安装结果。卡片会自动选择管理网络，在发行目录未提供模板时允许选择本地模板，要求操作员独立核对虚拟机显示的主机指纹，并显示已生成、等待连接和可用状态，提供重试连接、重新导入和主机密钥不符的指引。用户文档补充了虚拟机操作流程与信任边界。"
