kind = "security"
en = "Have the native Windows service issue protected, persistent run fences before forwarding managed SSH requests. Preserve independent renewal and block release or expired takeover while business requests are active or uncertain; production target isolation still requires VM acceptance."
zh_CN = "由 Windows 原生服务在转发托管 SSH 请求前发放受保护、持久递增的 run 隔离令牌；保留独立续租，并在业务请求仍活跃或结果不明时阻止释放和过期接管。生产目标隔离仍须真实 VM 验收。"
