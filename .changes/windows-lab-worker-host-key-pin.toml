kind = "fix"
en = "Pin the worker sshd host key reported by a fresh Windows worker installation instead of rejecting every successful guest provisioning. `lab provision --register` compared that receipt key with the controller SSH client key from the enrollment, so a correct install always failed with `worker host key is not the media SSH identity`. Provisioning now accepts the installer-generated Ed25519 host key, requires the receipt fingerprint to equal the recomputed SHA-256 fingerprint, rejects an empty, missing or malformed host key or a mismatched fingerprint, and writes that host key line into the registered environment's known-hosts pin while the identity file keeps pointing at the controller SSH client key."
zh_CN = "不再拒绝每一次成功的客体部署：改为固定全新 Windows Worker 安装上报的 sshd 主机密钥。`lab provision --register` 曾把该回执密钥与登记记录中的控制器 SSH 客户端密钥比较，导致正确安装总是以 `worker host key is not the media SSH identity` 失败。部署现在接受安装程序生成的 Ed25519 主机密钥，要求回执指纹等于重新计算的 SHA-256 指纹，拒绝缺失、为空、格式错误的主机密钥或不匹配的指纹，并把该主机密钥行写入登记环境的 known-hosts 固定项，同时身份文件仍指向控制器 SSH 客户端密钥。"
