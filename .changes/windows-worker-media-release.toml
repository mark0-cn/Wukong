kind = "feature"
en = "Build reproducible offline Windows worker media without controller private keys in CI. `python -m scripts.worker.media template` stages the unsigned payload, authenticated native binaries and manifest draft; `check` finalizes it with an ephemeral key and runs the non-elevated `WukongWorkerSetup.exe verify-enrollment`; release builds publish the deterministic `wukong-windows-worker-media-<version>.zip` as a separate release asset outside desktop update manifests. Operators run `finalize` with their controller key directory to seal the payload, sign enrollment and produce `WukongWorkerSetup.exe` media, and may use `pack`/`iso` for transfer. The archive contains no private key material."
zh_CN = "在不向 CI 提供控制器私钥的前提下构建可复现的 Windows Worker 离线介质。`python -m scripts.worker.media template` 暂存未签名载荷、已校验原生二进制文件与清单草稿；`check` 用临时密钥执行 finalize，并运行无需提权的 `WukongWorkerSetup.exe verify-enrollment`；发布构建以独立发布附件形式提供确定性的 `wukong-windows-worker-media-<version>.zip`，该附件不属于桌面更新清单。操作员使用自己的控制器密钥目录执行 `finalize`，密封载荷、签署登记记录并生成 `WukongWorkerSetup.exe` 介质，也可用 `pack`/`iso` 完成传递。归档中不含任何私钥材料。"
