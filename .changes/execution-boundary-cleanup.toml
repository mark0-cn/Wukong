kind = "fix"
en = "Use one registered handler per Worker operation and validate structured file, transfer, session and capability responses against the shared v3 contract. Retrying a completed session start preserves its closed state and original transcript; failed interactive cleanup retains ownership for reconciliation. Backend switching removes fields belonging to the previous transport."
zh_CN = "每项 Worker 操作直接绑定已注册处理器，文件、上传、会话和能力响应按共用 v3 契约校验。重试已完成的会话启动会保留关闭状态和原始 transcript，交互清理失败时保留归属以便对账。切换后端会移除上一种传输的字段。"
