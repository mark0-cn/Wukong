kind = "feature"
en = "Add offline installation media and an administrative VMware guest-operations channel: verified package members plus a hash-pinned install.ps1 are copied and executed as a local administrator, with immutable receipts and baseline-restore reconciliation. Cleanup is not executed because every analysis restores the disposable VM."
zh_CN = "新增离线安装介质与 VMware 客户机管理通道：校验后的包成员和哈希固定的 install.ps1 被复制并以本地管理员身份执行，写入不可变回执，并通过恢复基线核对未知结果。每次分析都恢复一次性 VM，因此不执行清理。"
