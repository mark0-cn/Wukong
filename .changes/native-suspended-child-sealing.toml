kind = "fix"
en = "Create native sandbox children suspended using the validated ordinary role token, then verify AppContainer identity and zero capabilities and remove all child privileges before execution. Failed fixed self-tests retain bounded creation controls that never resume a child or bypass readiness. Dedicated-environment qualification remains required."
zh_CN = "使用已验证的普通角色令牌挂起创建原生沙箱子进程，执行前核对 AppContainer 身份和零 capability，并移除子进程全部特权。固定自检失败时保留有界创建对照，对照不恢复子进程执行，也不绕过就绪门禁；仍须完成专用环境资格检查。"
