kind = "feature"
en = "Add native Windows minidump admission through the existing WinDbg MCP tool. Dump sessions verify PE/PDB/module metadata, never launch the target, and permit only inspection and close. Complete production availability remains disabled pending installed and adversarial acceptance."
zh_CN = "通过现有 WinDbg MCP 工具加入 Windows 原生 minidump 准入。转储会话核对 PE/PDB/模块元数据，不启动目标，仅允许检查和关闭。已安装及对抗验收完成前，完整生产可用性仍禁用。"
