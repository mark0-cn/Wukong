kind = "feature"
en = "Add a built-in Rust finalizer for offline Windows worker media. `wukong worker media generate` and the desktop application seal a released template with the controller key directory, sign enrollment, assemble the verified media, write a controller-credential-free deterministic ZIP and a schema-1 generation record without Python or a source checkout; `lab provision --template` uses the same finalizer on Windows."
zh_CN = "新增内置 Rust 离线 Windows Worker 介质 finalizer。`wukong worker media generate` 与桌面应用可用控制器密钥目录密封发布模板、签署登记、装配并校验介质，写出不含控制端凭据的确定性 ZIP 与 schema-1 生成记录，无需 Python 或源码检出；Windows 上的 `lab provision --template` 使用同一 finalizer。"
