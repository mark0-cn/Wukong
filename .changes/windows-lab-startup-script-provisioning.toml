kind = "fix"
en = "Boot offline worker provisioning from a local Group Policy machine startup script instead of a one-shot LocalSystem service. A real-VM acceptance run proved the service mechanism cannot work on Windows (SCM events 7009/7000, no receipt, no power-off): PowerShell never calls the service control dispatcher. `lab provision` now writes a fixed `wukong-provision-<id>.cmd` launcher to the machine Scripts/Startup folder, injects its [Startup] entry into the preserved scripts.ini, backs up the previous scripts.ini/gpt.ini bytes, bumps the local-GPO computer version, and never patches the SYSTEM hive; the wrapper restores the policy files, deletes the launcher, writes its identity-bound receipt and always powers the guest off. A stale leftover is refused with the exact cleanup command, and the new `wukong lab clean-guest --vm <alias> --operation <id> [--dry-run]` command removes only the named operation's provision directory, startup injection/backups and legacy service key from the powered-off guest disk (idempotent, foreign-id refusal)."
zh_CN = "改为由本地组策略机器启动脚本完成离线 Worker 部署，不再使用一次性 LocalSystem 服务。一次真实 VM 验收运行证明该服务机制在 Windows 上无法工作（SCM 事件 7009/7000、无回执、无关机）：PowerShell 从不调用服务控制分发器。`lab provision` 现在把固定的 `wukong-provision-<id>.cmd` 启动器写入机器的 Scripts/Startup 目录，将其 [Startup] 条目注入被保留的 scripts.ini，把原有 scripts.ini/gpt.ini 字节保存为备份，递增本地 GPO 计算机版本，且不再写入 SYSTEM 配置单元；包装脚本恢复策略文件、删除启动器、写入绑定身份的回执并始终关闭客体。遗留状态会以精确的清理命令被拒绝；新增的 `wukong lab clean-guest --vm <别名> --operation <id> [--dry-run]` 命令只从关机客体磁盘移除指定操作的部署目录、启动注入/备份和旧版服务键（幂等、拒绝外部 id）。"
