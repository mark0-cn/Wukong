en = "Persist session cleanup intent, reconcile owned Linux process groups and scratch after interruption, and keep uncertain sessions or cleanup-pending jobs visible until cleanup is confirmed. Serialize manual and automatic closure and block completion or environment maintenance while resources remain unresolved."
