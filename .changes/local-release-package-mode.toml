kind = "feature"
en = "Add a local-release packaging mode: cargo package-local now bundles a local-release.json descriptor and builds the client with the local-release Cargo feature, so first-run onboarding prepares the tool environment from a locally built Docker image without the online signed latest.json catalog. The mode verifies the image exists locally (building the documented Bake target when absent), records its size, protocol, data schema and source revision, uses a packaged local Windows worker media template when present, and marks the status payload with local_build. CI release packaging never enables it; --online keeps the previous catalog-dependent installer."
zh_CN = "新增本地发布打包模式：cargo package-local 现在会打包 local-release.json 描述文件并以 local-release Cargo feature 构建客户端，首次引导使用本机已构建的 Docker 镜像准备工具环境，无需线上签名的 latest.json 目录。该模式会校验镜像在本机存在（缺失时构建文档化的 Bake 目标）、记录镜像大小、协议、数据模式与源码提交，在存在本地 Windows Worker 媒体模板时直接使用，并在状态负载中标记 local_build。CI 发布打包不会启用该模式；--online 保留原先依赖线上目录的安装包。"
