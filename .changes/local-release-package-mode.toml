kind = "feature"
en = "Add a local-release packaging mode: cargo package-local now bundles a local-release.json descriptor and builds the client with the local-release Cargo feature, so first-run onboarding prepares the tool environment without the online signed latest.json catalog. The workbench image is resolved in order from WUKONG_LOCAL_IMAGE, the CI-built Docker Hub image local-<version> in a separate workbench repository (pulled, verified as linux/amd64 and tagged locally, replacing a stale wukong:local tag), an already present wukong:local tag only when that pull is impossible, or a local Bake fallback with an actionable warning; the descriptor records the image size, protocol, data schema and source revision, uses a packaged local Windows worker media template when present, and marks the status payload with local_build. A new manual Workbench image workflow lets maintainers build and publish that version-pinned image once, never touching the official release image or latest tag. CI release packaging never enables the mode; --online keeps the previous catalog-dependent installer."
zh_CN = "新增本地发布打包模式：cargo package-local 现在会打包 local-release.json 描述文件并以 local-release Cargo feature 构建客户端，首次引导不再依赖线上签名的 latest.json 目录。工作台镜像按顺序解析：WUKONG_LOCAL_IMAGE、独立工作台仓库中由 CI 构建的 local-<version> 镜像（拉取、校验 linux/amd64 并标记为本地镜像，覆盖陈旧的 wukong:local 标签）、仅在该拉取无法进行时才使用的本机已有 wukong:local 标签，最后是带可操作警告的本地 Bake 兜底；描述文件记录镜像大小、协议、数据模式与源码提交，存在本地 Windows Worker 媒体模板时直接使用，并在状态负载中标记 local_build。新增手动 Workbench image 工作流，维护者可按版本一次构建并发布该固定版本镜像，绝不触碰正式发布镜像或 latest 标签。CI 发布打包不会启用该模式；--online 保留原先依赖线上目录的安装包。"
