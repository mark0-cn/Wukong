kind = "feature"
en = "Add a local-release packaging mode: cargo package-local now bundles a local-release.json descriptor and builds the client with the local-release Cargo feature, so first-run onboarding prepares the tool environment without the online signed latest.json catalog. During packaging the workbench image is resolved from WUKONG_LOCAL_IMAGE, the CI-built Docker Hub image local-<version> in a separate workbench repository (pulled, verified as linux/amd64 and tagged locally, replacing a stale wukong:local tag), an already present wukong:local tag only when that pull is impossible, or a local Bake fallback with an actionable warning. The descriptor records the image size, protocol, data schema, source revision, the version-pinned image_registry (recorded even when packaging cannot reach Docker) and a packaged local Windows worker media template when present, and marks the status payload with local_build. A packaged installer is therefore usable on another machine: first-run onboarding reuses an existing local tag, otherwise pulls image_registry with docker pull --platform linux/amd64, verifies it and tags it as wukong:local with layer progress and cancellation, and on failure reports the exact pull/tag, docker login and local Bake commands; the official release image repository is refused. A new manual Workbench image workflow lets maintainers build and publish that version-pinned image once, never touching the official release image or latest tag. CI release packaging never enables the mode; --online keeps the previous catalog-dependent installer."
zh_CN = "新增本地发布打包模式：cargo package-local 现在会打包 local-release.json 描述文件并以 local-release Cargo feature 构建客户端，首次引导不再依赖线上签名的 latest.json 目录。打包时工作台镜像按顺序解析：WUKONG_LOCAL_IMAGE、独立工作台仓库中由 CI 构建的 local-<version> 镜像（拉取、校验 linux/amd64 并标记为本地镜像，覆盖陈旧的 wukong:local 标签）、仅在该拉取无法进行时才使用的本机已有 wukong:local 标签，最后是带可操作警告的本地 Bake 兜底。描述文件记录镜像大小、协议、数据模式、源码提交、按版本固定的 image_registry（即使打包时无法连接 Docker 也会记录）以及存在时的本地 Windows Worker 媒体模板，并在状态负载中标记 local_build。因此打包好的安装包可在另一台机器上使用：首次引导优先复用已有本地标签，否则以 docker pull --platform linux/amd64 拉取 image_registry、校验后标记为 wukong:local，并显示分层进度且可取消；失败时给出确切的拉取/标记、docker login 与本地 Bake 命令；正式发布镜像仓库会被拒绝。新增手动 Workbench image 工作流，维护者可按版本一次构建并发布该固定版本镜像，绝不触碰正式发布镜像或 latest 标签。CI 发布打包不会启用该模式；--online 保留原先依赖线上目录的安装包。"
