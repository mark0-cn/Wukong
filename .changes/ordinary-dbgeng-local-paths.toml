kind = "fix"
en = "Validate local DbgEng paths without Windows normalized-name queries that fail under a worker token with every privilege removed. Keep local-only, link-free path and exact content checks; no worker privileges are restored. Actual installed-worker acceptance remains separate."
zh_CN = "校验本地 DbgEng 路径时，避免在已移除全部权限的 worker 令牌下失败的 Windows 名称规范化查询。继续执行仅本地、无链接的路径及精确内容检查，不恢复 worker 权限。真实已安装 worker 验收仍单独执行。"
