kind = "feature"
en = "Add explicit `wukong recover RUN_ID` recovery for assessments left running by a killed controller. The default records an interrupted, resumable pause without guessing worker job outcomes; `--stop` explicitly stops the root branch, and a live controller or terminal run remains protected."
zh_CN = "新增显式 `wukong recover RUN_ID`，用于恢复控制端被终止后仍显示运行中的任务。默认记录可续跑的中断暂停，不猜测 worker job 结果；`--stop` 显式停止根任务分支，并保护存活控制端及已终态任务。"
