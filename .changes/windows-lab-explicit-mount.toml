kind = "fix"
en = "Mount offline Windows lab system volumes by their fixed SYSTEM and SOFTWARE hive paths instead of libguestfs OS inspection, avoiding case-sensitive-path failures on writable VMware delta disks while retaining all media, hash and receipt checks."
zh_CN = "离线 Windows 实验系统卷现在通过固定 SYSTEM 和 SOFTWARE 配置单元路径识别并显式挂载，不再依赖 libguestfs 操作系统检测，避免可写 VMware delta 磁盘上的 case-sensitive-path 故障，同时保留全部介质、哈希和回执校验。"
