kind = "breaking"
en = "Add native Windows input reduction using a pinned ddmin library, owned process execution and WinDbg MCP crash observations. Preserve immutable candidate evidence, bounded attempts and deadlines, and explicit weak-equivalence opt-in. Remove the previously ignored trials and expected minimization fields; omit them from existing input_minimize calls."
zh_CN = "新增原生 Windows 输入缩减，使用固定版本 ddmin 库、受管进程执行及 WinDbg MCP 崩溃观测。保留不可变候选证据、尝试与期限限制，以及显式弱等价性选项。移除最小化中此前被忽略的 trials、expected 字段；现有 input_minimize 调用须删去它们。"
