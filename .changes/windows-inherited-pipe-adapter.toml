kind = "fix"
en = "Use a pipe I/O library with bounded buffers for private Windows debugger communication, while retaining protobuf framing, request identity checks and owned process cleanup. Dedicated offline VM startup and persistent debugger sessions qualify this adapter."
zh_CN = "私有 Windows 调试通信改用具有有界缓冲的管道 I/O 库，保留 protobuf 帧、请求身份校验及所属进程清理。专用离线 VM 的启动及持久调试会话已验收此适配器。"
