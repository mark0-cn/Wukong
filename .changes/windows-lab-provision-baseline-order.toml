kind = "fix"
en = "Fix replacement provisioning for a VM sitting on its fixed-base delta: restore `wukong_base_vm` before resolving the offline guest disk, persist the recovery intent before mutation, and retain the old base while the replacement is staged and verified. Offline guest paths remain absolute `C:\\` paths translated once by the WSL disk adapter."
zh_CN = "修复停留在固定基线差异盘上的 VM 的替换部署：先恢复 `wukong_base_vm` 再解析离线客体磁盘，在变更前持久化恢复意图，并在暂存和校验替换期间保留旧基线。离线客体路径继续使用绝对 `C:\\` 路径，由 WSL 磁盘适配器一次性转换。"
