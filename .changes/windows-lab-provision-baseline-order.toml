kind = "fix"
en = "Fix `wukong lab provision --replace-baseline`: the command now backs up the VMX and persists the recovery intent before deleting exactly the configured baseline snapshot, and only then resolves and validates the committed guest disk, so a VM sitting on a baseline snapshot delta can be re-provisioned. No other snapshot is deleted, a post-deletion validation failure stays `recovery_required` and names the VMX backup, and passing the flag when no snapshot exists is a documented no-op. Offline guest paths are now consistently absolute `C:\\` paths translated once by the WSL disk adapter."
zh_CN = "修复 `wukong lab provision --replace-baseline`：命令现在先备份 VMX 并持久化恢复意图，只删除配置的基线快照，然后才解析并校验提交后的客体磁盘，因此停留在基线快照差异盘上的 VM 可以重新部署。其他快照永不被删除；删除后校验失败会保持 `recovery_required` 并指出 VMX 备份；不存在快照时传入该标志是明确记录的空操作。离线客体路径现在统一为绝对 `C:\\` 路径，由 WSL 磁盘适配器一次性转换。"
