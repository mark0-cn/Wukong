kind = "fix"
en = "Include SYSTEMDRIVE derived from the validated Windows root in the minimal native child environment, fixing ProgramData known-folder resolution. A fresh child regression excludes ambient variables and cached Shell state."
zh_CN = "在原生子进程最小环境中加入由已验证 Windows 根路径推导的 SYSTEMDRIVE，修复 ProgramData 已知文件夹解析；通过全新子进程回归排除环境变量继承和 Shell 缓存掩盖问题。"
