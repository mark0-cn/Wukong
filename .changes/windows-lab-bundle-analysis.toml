kind = "feature"
en = "Analyze software install directories as bundles without user-assigned roles: the directory scan hashes every file, infers PE executable/library kinds and import edges, imports individual members for Ghidra, and stages up to 64 members into one worker directory with a LaunchSpec so the inferred entry runs beside its DLLs."
zh_CN = "无需用户标注角色即可把软件安装目录作为 bundle 分析：目录扫描为每个文件计算哈希，推断 PE executable/library 类型与导入边，可单独导入成员供 Ghidra 分析，并把最多 64 个成员 staging 到同一 worker 目录，通过 LaunchSpec 让推断入口带着 DLL 运行。"
