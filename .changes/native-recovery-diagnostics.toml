kind = "fix"
en = "Windows worker cleanup failures now identify the original resource, recovery attempt and failed cleanup stage while retaining the resource blocker. This improves diagnosis; it does not by itself fix interruption recovery."
zh_CN = "Windows worker 清理失败现在标明原始资源、恢复尝试及失败阶段，并保留资源阻塞状态。这改善了故障定位，本身不代表已修复中断恢复。"
