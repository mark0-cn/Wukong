kind = "fix"
en = "Harden release and workbench publication with App provenance, reviewed environments, immutable-tag checks and real image acceptance. Run Linux frontend checks for UI changes, parallelize native Windows worker checks, lock Python image dependencies, update GEF and Temurin, and allow ordinary PRs to reuse only bounded, attested equivalent test results while keeping release artifacts bound to exact commits."
zh_CN = "通过发布 App 来源、审批环境、不可变标签检查和真实镜像验收强化正式及工作台发布。UI 改动补充 Linux 前端检查，原生 Windows Worker 检查改为并行，锁定 Python 镜像依赖并更新 GEF 与 Temurin。普通 PR 仅可复用有界且经证明的等价测试结果，发布产物仍绑定精确提交。"
