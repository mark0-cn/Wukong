kind = "fix"
en = "Establish the Windows worker boot identity from the OS loader sequence and boot-entry identity, removing PowerShell/WMI startup dependencies and any requirement to see all processes. Missing or unsupported native identity data fails closed."
zh_CN = "通过 OS loader 启动序号及启动配置项身份建立 Windows worker 启动身份，去掉 PowerShell/WMI 启动依赖，也不再要求能看见所有进程；缺失或不受支持的原生身份数据会被拒绝。"
