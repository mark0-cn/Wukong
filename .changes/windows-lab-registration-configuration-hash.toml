kind = "fix"
en = "Keep the persisted lab configuration identity in step with `lab provision --register`. Registration rewrites the mapped `[environments.<id>]` entry, but the state written afterwards kept the pre-registration fingerprint, so every later `lab status`/`prepare`/dry-run command failed with `lab VM configuration changed; reconcile the old physical VM before re-registering` and no CLI path could repair it. A successful registration now rebinds the persisted state and the physical-VM identity to the hash recomputed from the entry read back from the rewritten configuration, before any later doctor or baseline-revert failure can occur; a registration failure restores the timestamped configuration backup and keeps the previous mapping and identity, a failed doctor after a successful rewrite still adopts it, and a VM or environment change made outside the operation is still refused."
zh_CN = "让持久化的实验室配置标识与 `lab provision --register` 保持同步。登记会重写已映射的 `[environments.<id>]` 条目，但之后保存的状态仍保留登记前的指纹，导致后续每条 `lab status`/`prepare`/dry-run 命令都因 `lab VM configuration changed; reconcile the old physical VM before re-registering` 失败，且没有任何 CLI 路径可以修复。现在成功的登记会在后续 doctor 或基线回滚失败之前，把持久化状态与物理 VM 标识重新绑定到从重写后的配置读回的条目所重新计算的哈希；登记失败会从带时间戳的配置备份恢复并保留原有映射与标识；重写成功后 doctor 失败仍会采用该重写；在该操作之外对 VM 或环境所做的更改仍会被拒绝。"
