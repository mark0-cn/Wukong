kind = "fix"
en = "Boot offline worker provisioning from a fixed Windows Task Scheduler boot-trigger task instead of a local Group Policy startup script. Real-VM evidence proved the local-GPO mechanism never executes on the lab guest: the Group Policy operational log filtered the machine policy out as empty at every recorded boot (events 4000/5312/5313/8000, \"local Group Policy not applied (empty)\"), the injected scripts.ini startup entry never ran, the PowerShell operational log stayed empty and no receipt or power-off followed. `lab provision` now writes the fixed task file `C:\\Windows\\System32\\Tasks\\WukongLabProvision` and registers its canonical `Tree`/`Tasks`/`Boot` TaskCache values in the guest SOFTWARE hive; the task runs the fixed `launch.ps1` as NT AUTHORITY\\SYSTEM without a login. The registration is a byte-identical fixture captured from a real Windows registration (Task Scheduler's Hash/Triggers/Actions are internal binary serializations) and cross-checked against a Windows 10 reference volume; a fixed GUID and a well-known-SID security descriptor make it machine independent. The wrapper writes its receipt first, unregisters its own fixed task, deletes the boot launcher, schedules removal of the wrapper and plan and always powers the guest off. The retired local-GPO injection code (including the bug that masked the GPT.INI computer/user version halves backwards) is deleted. `lab clean-guest` now removes the fixed scheduled-task file/registration/launcher as well as the operation directory, restores retired policy backups byte for byte instead of appending a newline, and deletes a CLI-created gpt.ini that has no backup only for the last recorded operation and only while its bytes equal the exact created document. Reconcile retries transient file-removal sharing violations instead of stopping half-applied."
zh_CN = "改为使用固定的 Windows 计划任务开机触发器完成离线 Worker 部署，不再使用本地组策略启动脚本。真实 VM 证据表明本地组策略机制在该实验客体上从不执行：组策略操作日志在每次记录的启动中都将机器策略过滤为“空”（事件 4000/5312/5313/8000，消息为“本地组策略未应用（空）”），注入的 scripts.ini 启动条目从未运行，PowerShell 操作日志为空，也没有产生回执或关机。`lab provision` 现在把固定任务文件 `C:\\Windows\\System32\\Tasks\\WukongLabProvision` 写入客体，并在客体 SOFTWARE 配置单元中注册其规范化 `Tree`/`Tasks`/`Boot` TaskCache 值；任务在无需登录的情况下以 NT AUTHORITY\\SYSTEM 运行固定 `launch.ps1`。注册采用从真实 Windows 注册逐字节捕获、并与 Windows 10 参考系统卷交叉核对的夹具（任务计划程序的 Hash/Triggers/Actions 是内部二进制序列化）；固定 GUID 与仅含知名 SID 的安全描述符使其与具体机器无关。包装脚本先写回执，再注销自己的固定任务、删除启动器、安排删除包装脚本与计划，并始终让客体关机。退役的本地组策略注入代码（包括把 GPT.INI 计算机/用户版本半段掩码写反的缺陷）已删除。`lab clean-guest` 现在同时移除固定计划任务文件/注册/启动器与操作目录，按字节精确恢复退役策略备份（不再追加换行），并且仅对最后记录的代码操作为之、仅当字节仍等于精确创建文档时删除无备份的 CLI 创建 gpt.ini。调和遇到瞬时文件删除共享冲突时会重试，而不是停在半完成状态。"
