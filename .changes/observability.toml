kind = "breaking"
en = "Add a fourth desktop Observability workspace with durable local activity that remains available without external backends, independently degraded Tempo, Loki and Prometheus panels, service-scoped metrics and Grafana deep links. Add controller OTLP traces/metrics, opt-in curated OTLP logs and local JSONL retention, plus protocol-4 W3C trace propagation from Linux and Windows workers through bounded credential-free worker queues and controller-owned export. Telemetry remains best-effort and never replaces business state, evidence, completion or recovery. Upgrade the controller and all Workers together; protocol-3 Workers are rejected."
zh_CN = "新增桌面第四个 Observability 工作区：持久化本地活动无需外部后端即可使用，Tempo、Loki 和 Prometheus 面板可独立降级，并提供服务范围指标及 Grafana 深链接。新增控制器 OTLP traces/metrics、显式启用的精选 OTLP logs 和本地 JSONL 保留，并通过协议 4 的 W3C trace 传播，将 Linux 与 Windows Worker 的有界无凭据本地队列接入控制器统一导出。Telemetry 仍按尽力投递处理，绝不替代业务状态、证据、完成或恢复。控制器与所有 Worker 必须一起升级；协议 3 的 Worker 会被拒绝。"
