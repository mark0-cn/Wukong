kind = "feature"
en = "Provision the registered Windows lab VM worker offline with the operator-only `wukong lab provision` command: it re-verifies finalized worker media (or finalizes a released template with the controller key directory), builds a `WUKONG_OFFLINE` ISO, injects a fixed local Group Policy machine startup script through WSL libguestfs (the proven `.cmd` launcher under Scripts/Startup plus a preserved `scripts.ini` [Startup] entry and a restore-safe local-GPO version bump), boots the guest to install the worker, restores the VMX, verifies the guest receipt offline and creates the configured baseline snapshot. `--register` writes the controller-managed SSH environment (controller-generated identity, timestamped configuration backup, public host pin) and `--verify-environment` runs the environment doctor; failures become `recovery_required` and are resolved with `lab reconcile`, and failed guest leftovers are removed with `lab clean-guest`. A real-VM acceptance run proved the earlier service-based boot mechanism cannot start on Windows; the startup-script replacement is covered by fake host/disk/ISO/environment adapter tests and awaits operator acceptance on a dedicated VM."
zh_CN = "通过仅限操作者的 `wukong lab provision` 命令离线部署已登记 Windows 实验 VM 的 Worker：重新校验最终 Worker 介质（或用控制器密钥目录 finalize 发布模板），构建 `WUKONG_OFFLINE` ISO，通过 WSL libguestfs 注入固定的本地组策略机器启动脚本（已证明可行的 Scripts/Startup 下 `.cmd` 启动器、保留的 `scripts.ini` [Startup] 条目以及可恢复的本地 GPO 版本递增），启动客体安装 Worker，恢复 VMX，离线校验客体回执并创建配置的基线快照。`--register` 写入控制器管理的 SSH 环境（控制器生成的身份、带时间戳的配置备份、公开主机固定项），`--verify-environment` 运行环境 doctor；失败会进入 `recovery_required` 并通过 `lab reconcile` 解决，客体遗留状态通过 `lab clean-guest` 清除。一次真实 VM 验收运行证明旧的基于服务的启动机制无法在 Windows 上启动；启动脚本替代实现由 fake 宿主/磁盘/ISO/环境适配器测试覆盖，仍需操作者在专用 VM 上完成验收。"
