kind = "feature"
en = "Provision the registered Windows lab VM worker offline with the operator-only `wukong lab provision` command: it re-verifies finalized worker media (or finalizes a released template with the controller key directory), builds a `WUKONG_OFFLINE` ISO, injects a fixed one-shot LocalSystem service through WSL libguestfs/hivexsh, boots the guest to install the worker, restores the VMX, verifies the guest receipt offline and creates the configured baseline snapshot. `--register` writes the controller-managed SSH environment (controller-generated identity, timestamped configuration backup, public host pin) and `--verify-environment` runs the environment doctor; failures become `recovery_required` and are resolved with `lab reconcile`. No real VM injection has been executed yet: tests use fake host/disk/ISO/environment adapters, and operator acceptance remains outstanding."
zh_CN = "通过仅限操作者的 `wukong lab provision` 命令离线部署已登记 Windows 实验 VM 的 Worker：重新校验最终 Worker 介质（或用控制器密钥目录 finalize 发布模板），构建 `WUKONG_OFFLINE` ISO，通过 WSL libguestfs/hivexsh 注入固定的一次性 LocalSystem 服务，启动客体安装 Worker，恢复 VMX，离线校验客体回执并创建配置的基线快照。`--register` 写入控制器管理的 SSH 环境（控制器生成的身份、带时间戳的配置备份、公开主机固定项），`--verify-environment` 运行环境 doctor；失败会进入 `recovery_required` 并通过 `lab reconcile` 解决。尚未执行真实 VM 注入：测试使用 fake 宿主/磁盘/ISO/环境适配器，操作者验收仍需完成。"
