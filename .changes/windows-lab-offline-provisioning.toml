kind = "feature"
en = "Provision the registered Windows lab VM worker offline with the operator-only `wukong lab provision` command: it re-verifies finalized worker media (or finalizes a released template with the controller key directory), builds a `WUKONG_OFFLINE` ISO, injects a fixed Windows Task Scheduler boot-trigger task (task XML under System32\\Tasks plus its canonical TaskCache registration in the guest SOFTWARE hive) through WSL libguestfs/hivexsh, boots the guest so the task runs the wrapper as SYSTEM without a login, restores the VMX, verifies the guest receipt offline and creates the configured baseline snapshot. `--register` writes the controller-managed SSH environment (controller-generated identity, timestamped configuration backup, public host pin) and `--verify-environment` runs the environment doctor; failures become `recovery_required` and are resolved with `lab reconcile`, and failed guest leftovers are removed with `lab clean-guest`. Earlier real-VM acceptance runs proved the service mechanism (SCM 7009/7000) and the local Group Policy startup-script mechanism (GP events 5312/5313, policy filtered out as empty) cannot boot this guest; the scheduled-task replacement is covered by fake host/disk/ISO/environment adapter tests and its canonical registration was proven offline against a real Task Scheduler store, while a real-VM boot acceptance remains operator-run on a dedicated VM."
zh_CN = "通过仅限操作者的 `wukong lab provision` 命令离线部署已登记 Windows 实验 VM 的 Worker：重新校验最终 Worker 介质（或用控制器密钥目录 finalize 已发布模板），构建 `WUKONG_OFFLINE` ISO，通过 WSL libguestfs/hivexsh 注入固定的 Windows 计划任务开机触发器（任务 XML 位于 System32\\Tasks，并在客体 SOFTWARE 配置单元中注册其规范化 TaskCache 值），启动客体使任务在无需登录的情况下以 SYSTEM 运行包装脚本，恢复 VMX，离线校验客体回执并创建配置的基线快照。`--register` 写入控制器管理的 SSH 环境（控制器生成的密钥、带时间戳的配置备份、公开主机固定项），`--verify-environment` 运行环境 doctor；失败会进入 `recovery_required` 并通过 `lab reconcile` 解决，失败的客体遗留状态通过 `lab clean-guest` 清除。此前的真实 VM 验收运行证明服务机制（SCM 7009/7000）与本地组策略启动脚本机制（组策略事件 5312/5313，策略被过滤为空）都无法启动该客体；计划任务替代实现由 fake 宿主/磁盘/ISO/环境适配器测试覆盖，其规范化注册也已在真实任务计划程序存储上离线验证，真实 VM 启动验收仍需操作者在专用 VM 上执行。"
