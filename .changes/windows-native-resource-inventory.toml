kind = "feature"
en = "Native Windows workers enumerate jobs and resource summaries from their protected journal, with run isolation and bounded pagination. Discovery retains original ownership and completed results across restart; full Windows production routing remains pending."
zh_CN = "Windows 原生 worker 从受保护账本枚举任务和资源摘要，按 run 隔离并限制分页大小。重启后的发现保留原始归属及已完成结果；完整 Windows 生产路由仍待完成。"
